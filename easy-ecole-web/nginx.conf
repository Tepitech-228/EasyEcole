# =============================================================================
# EasyEcole - Configuration nginx (conteneur frontend)
#
# Rôles :
#  1. Servir le build Angular (SPA) avec fallback try_files -> index.html
#  2. Proxy /api/  -> backend:3000   (API Express montée sous /api/v1)
#  3. Proxy /media/ -> backend:3000  (photos, profils, vidéos statiques)
#  4. Proxy /socket.io/ -> backend:3000 (chat temps réel, upgrade WebSocket)
#  5. Proxy /api-docs/ (Swagger) et /logo-esa.png
#
# Le nom de service "backend" est résolu par le réseau Docker (docker-compose).
# =============================================================================

server {
    listen 80;
    server_name _;

    # Racine du build Angular
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Compression gzip
    # ------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff font/woff2;
    gzip_vary on;

    # ------------------------------------------------------------------
    # SPA : toute URL non résolue renvoie index.html (routing Angular)
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # API Express (montée sous /api/v1 par le backend)
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 250m;   # upload vidéo max 200 Mo (multer) + marge
    }

    # ------------------------------------------------------------------
    # Médias statiques servis par le backend (photos, profils, vidéos)
    # ------------------------------------------------------------------
    location /media/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Socket.IO (chat temps réel) — upgrade vers WebSocket
    # ------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Swagger UI (documentation API du backend)
    # ------------------------------------------------------------------
    location /api-docs/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logo-esa.png {
        proxy_pass http://backend:3000;
    }

    # ------------------------------------------------------------------
    # Cache navigateur long pour les assets statiques du build (hashés),
    # sans jamais intercepter les chemins proxys (/api/, /media/, /socket.io/…)
    # ------------------------------------------------------------------
    location ~* ^/(?!api/|media/|socket\.io/|api-docs/)[^.]*\.(?:js|css|png|jpe?g|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
