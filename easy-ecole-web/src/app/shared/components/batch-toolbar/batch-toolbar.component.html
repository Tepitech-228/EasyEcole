<div *ngIf="selectedCount > 0" class="bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-3 mb-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-indigo-600">checklist</span>
    <span class="text-sm font-medium text-indigo-800">
      {{ selectedCount }} élément(s) sélectionné(s)
    </span>
    <button (click)="onDeselectAll()" class="text-xs text-indigo-600 hover:text-indigo-800 underline">
      Désélectionner
    </button>
  </div>
  <div class="flex gap-2">
    <app-custom-button *ngFor="let a of actions"
      (click)="onAction(a.action)"
      [text]="a.label"
      [color]="a.color"
      [disabled]="loading || !!a.disabled">
    </app-custom-button>
  </div>
</div>
