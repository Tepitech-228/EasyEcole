<button [routerLink]="link" [disabled]="isDisabled" [ngClass]="[fullWidth ? 'w-full' : '', outlined ? 'text-' + color + '-600 ring-1 ring-inset ring-' + color + '-400 hover:bg-' + color + '-100' : 'text-white bg-' + color + '-600 hover:bg-' + color + '-500']" style="min-width: 100px;"
    class="inline-flex items-center justify-center gap-2 rounded px-4 py-1.5 text-sm font-medium leading-7 shadow-sm">
    <span *ngIf="loading" class="btn-spinner"></span>
    <span *ngIf="!loading && icon && iconPosition === 'left'" class="material-symbols-outlined text-base leading-none">{{ icon }}</span>
    {{ text }}
    <span *ngIf="!loading && icon && iconPosition === 'right'" class="material-symbols-outlined text-base leading-none">{{ icon }}</span>
</button>
