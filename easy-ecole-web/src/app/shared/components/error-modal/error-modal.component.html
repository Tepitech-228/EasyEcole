<!--
  Modal global de gestion d'erreurs - EasyEcole
  100% Tailwind CSS (plus aucune classe Bootstrap).
  - Variante "simple": modal centré simple (équivalent de modal-dialog-centered)
  - Variante "scrollable": modal centré scrollable (équivalent de modal-dialog-centered modal-dialog-scrollable)
-->

<!-- Backdrop + Overlay combinés -->
<div *ngIf="isVisible" class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" (click)="close()" [ngClass]="{'pointer-events-auto': showDetails}">

  <!-- Content container - ne pas fermer si on clique à l'intérieur du modal -->
  <div class="pointer-events-auto max-w-full" (click)="$event.stopPropagation()">

    <!-- ========== MODAL SIMPLE (centered) - erreurs 400, 403, 404, 401 courte ========== -->
    <div *ngIf="modalSize === 'simple'" class="fixed inset-0 z-[1] flex items-center justify-center p-4" (click)="close()">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-auto border border-gray-200" [ngClass]="modalTypeClass" (click)="$event.stopPropagation()">

        <!-- Header -->
        <div class="flex items-center p-4 border-b border-gray-200 gap-3">
          <div class="flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-full" [ngClass]="iconTypeClass">
            <span [innerHTML]="typeIcon"></span>
          </div>
          <h5 class="text-lg font-semibold text-gray-800 flex-1">{{ title }}</h5>
          <button type="button" class="bg-transparent border-0 cursor-pointer p-1 opacity-60 hover:opacity-100 hover:text-gray-900 text-gray-500 flex items-center justify-center flex-shrink-0" aria-label="Fermer" (click)="close()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
          </button>
        </div>

        <!-- Body -->
        <div class="p-4">
          <p class="mb-0 text-sm text-gray-600 leading-relaxed">{{ message }}</p>
        </div>

        <!-- Footer -->
        <div class="flex flex-wrap items-center justify-end p-4 border-t border-gray-200 gap-2">
          <button *ngIf="showReconnectButton" class="inline-flex items-center px-4 py-2 bg-red-600 text-white border border-transparent rounded-lg text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-red-700" (click)="reconnect()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="mr-2">
              <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
              <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
            </svg>
            Se reconnecter
          </button>
          <button *ngIf="details.length > 0" class="inline-flex items-center px-4 py-2 border border-gray-500 text-gray-600 bg-transparent rounded-lg text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-600 hover:text-white hover:border-gray-600" (click)="toggleDetails()">
            {{ detailsToggleText }}
          </button>
          <button class="inline-flex items-center px-4 py-2 bg-gray-600 text-white border border-transparent rounded-lg text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-700" (click)="close()">Fermer</button>
        </div>

      </div>
    </div>

    <!-- ========== MODAL SCROLLABLE (centered + scrollable) - erreurs 500, validation, listes ========== -->
    <div *ngIf="modalSize === 'scrollable'" class="fixed inset-0 z-[1] flex items-center justify-center p-4" (click)="close()">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-auto border border-gray-200 flex flex-col max-h-[90vh]" [ngClass]="modalTypeClass" (click)="$event.stopPropagation()">

        <!-- Header -->
        <div class="flex items-center p-4 border-b border-gray-200 gap-3 shrink-0">
          <div class="flex-shrink-0 w-9 h-9 flex items-center justify-center rounded-full" [ngClass]="iconTypeClass">
            <span [innerHTML]="typeIcon"></span>
          </div>
          <h5 class="text-lg font-semibold text-gray-800 flex-1">{{ title }}</h5>
          <button type="button" class="bg-transparent border-0 cursor-pointer p-1 opacity-60 hover:opacity-100 hover:text-gray-900 text-gray-500 flex items-center justify-center flex-shrink-0" aria-label="Fermer" (click)="close()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
          </button>
        </div>

        <!-- Body scrollable -->
        <div class="p-4 overflow-y-auto flex-1 error-modal-scroll" style="max-height: 70vh;">
          <p class="mb-0 text-sm text-gray-600 leading-relaxed">{{ message }}</p>

          <!-- Liste des détails d'erreur (ex: import Excel, validation) -->
          <div *ngIf="details.length > 0" class="mt-4">
            <h6 class="text-sm font-semibold text-gray-800 mb-2">Détail{{ details.length > 1 ? 's' : '' }} :</h6>
            <ul class="list-none p-0 m-0">
              <li *ngFor="let detail of details" class="py-2 px-3 mb-1.5 text-sm text-gray-600 rounded" [ngClass]="detailItemClass">
                {{ detail }}
              </li>
            </ul>
          </div>

          <!-- Stack trace ou info technique -->
          <div *ngIf="statusCode >= 500 && details.length === 0" class="mt-4 p-3 bg-gray-50 rounded-lg">
            <p class="text-gray-500 text-xs">
              Code erreur: {{ statusCode }}<br>
              Veuillez contacter l'administrateur si le problème persiste.
            </p>
          </div>
        </div>

        <!-- Footer -->
        <div class="flex flex-wrap items-center justify-end p-4 border-t border-gray-200 gap-2 shrink-0">
          <button *ngIf="showReconnectButton" class="inline-flex items-center px-4 py-2 bg-red-600 text-white border border-transparent rounded-lg text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-red-700" (click)="reconnect()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="mr-2">
              <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
              <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
            </svg>
            Se reconnecter
          </button>
          <button *ngIf="!showDetails && details.length > 0" class="inline-flex items-center px-4 py-2 border border-gray-500 text-gray-600 bg-transparent rounded-lg text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-600 hover:text-white hover:border-gray-600" (click)="toggleDetails()">
            {{ detailsToggleText }}
          </button>
          <button *ngIf="showDetails" class="inline-flex items-center px-4 py-2 border border-gray-500 text-gray-600 bg-transparent rounded-lg text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-600 hover:text-white hover:border-gray-600" (click)="toggleDetails()">
            Voir résumé
          </button>
          <button class="inline-flex items-center px-4 py-2 bg-gray-600 text-white border border-transparent rounded-lg text-sm font-medium cursor-pointer transition-colors duration-150 hover:bg-gray-700" (click)="close()">Fermer</button>
        </div>

      </div>
    </div>

  </div>
</div>
