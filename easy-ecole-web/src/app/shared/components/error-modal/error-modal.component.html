<div
  *ngIf="isVisible"
  class="ee-notice-backdrop"
  role="presentation"
  (click)="close()"
  (keydown.escape)="close()">
  <section
    class="ee-notice-card"
    [ngClass]="[modalTypeClass, modalSize === 'scrollable' ? 'ee-notice-card--scrollable' : '']"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="eeNoticeTitle"
    aria-describedby="eeNoticeMessage"
    (click)="$event.stopPropagation()">
    <header class="ee-notice-header">
      <div class="ee-notice-icon" [ngClass]="iconTypeClass" aria-hidden="true">
        <span [innerHTML]="typeIcon"></span>
      </div>
      <div class="ee-notice-heading">
        <span class="ee-notice-eyebrow">ESA ÉCOLE · NOTIFICATION</span>
        <h2 id="eeNoticeTitle">{{ title }}</h2>
      </div>
      <button type="button" class="ee-notice-close" aria-label="Fermer la fenêtre" (click)="close()">
        <span aria-hidden="true">×</span>
      </button>
    </header>

    <div class="ee-notice-body">
      <p id="eeNoticeMessage">{{ message }}</p>
      <div *ngIf="showReconnectButton" class="ee-notice-guidance">
        Votre session n’est plus valide. Reconnectez-vous pour continuer.
      </div>
      <div *ngIf="showDetails && details.length > 0" class="ee-notice-details">
        <h3>Détail{{ details.length > 1 ? 's' : '' }}</h3>
        <ul>
          <li *ngFor="let detail of details">{{ detail }}</li>
        </ul>
      </div>
    </div>

    <footer class="ee-notice-footer">
      <button
        *ngIf="showReconnectButton"
        type="button"
        class="ee-notice-button ee-notice-button--primary"
        (click)="reconnect()">
        Se reconnecter
      </button>
      <button
        *ngIf="details.length > 0 && !showDetails"
        type="button"
        class="ee-notice-button ee-notice-button--secondary"
        (click)="toggleDetails()">
        {{ detailsToggleText }}
      </button>
      <button
        *ngIf="showDetails && details.length > 0 && !showReconnectButton"
        type="button"
        class="ee-notice-button ee-notice-button--secondary"
        (click)="toggleDetails()">
        {{ detailsToggleText }}
      </button>
      <button
        *ngIf="!showReconnectButton"
        type="button"
        class="ee-notice-button ee-notice-button--primary"
        [ngClass]="type === 'success' ? 'ee-notice-button--success' : ''"
        (click)="close()">
        {{ type === 'success' ? 'Continuer' : 'Fermer' }}
      </button>
    </footer>
  </section>
</div>
