<div class="mb-8">
    <div class="bg-white border border-gray-200 rounded-lg px-4 py-5 overflow-x-auto">
        <div class="flex items-start min-w-[760px]">
            <ng-container *ngFor="let item of items; index as i">
                <!-- Étape -->
                <div class="flex flex-col items-center w-28 shrink-0">
                    <a role="button" tabindex="0"
                        (click)="peutCliquer(i) ? item.action() : null"
                        [attr.aria-label]="item.text"
                        [ngClass]="peutCliquer(i) ? 'cursor-pointer group' : 'cursor-not-allowed opacity-60'">
                        <span
                            class="relative flex items-center justify-center w-12 h-12 rounded-full border-2 transition-all duration-200 group-hover:scale-105"
                            [ngClass]="cercleClasses(item, i)">
                            <!-- Étape terminée : icône + coche -->
                            <svg *ngIf="!item.incomplete" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" [attr.d]="item.icon"/>
                            </svg>
                            <!-- Étape incomplète : alerte -->
                            <svg *ngIf="item.incomplete" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                            </svg>

                            <!-- Coche de validation -->
                            <span *ngIf="item.condition && !item.incomplete"
                                class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-white border border-gray-200 flex items-center justify-center shadow-sm">
                                <svg class="w-3 h-3 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                                </svg>
                            </span>

                            <!-- Numéro de l'étape -->
                            <span
                                class="absolute -top-1.5 -left-1.5 w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center border"
                                [ngClass]="numeroClasses(item)">
                                {{ i + 1 }}
                            </span>
                        </span>
                    </a>
                    <span class="mt-2.5 text-xs font-medium text-center leading-snug px-1"
                        [ngClass]="labelClasses(item)">
                        {{ item.text }}
                    </span>
                </div>

                <!-- Connecteur -->
                <div *ngIf="i != items.length - 1" class="flex-1 min-w-[36px] h-0.5 rounded mt-6 overflow-hidden bg-gray-200">
                    <div class="h-full rounded transition-all duration-300"
                        [ngClass]="items[i + 1].condition ? 'bg-green-600' : item.condition ? 'bg-green-600' : 'bg-transparent'"></div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
