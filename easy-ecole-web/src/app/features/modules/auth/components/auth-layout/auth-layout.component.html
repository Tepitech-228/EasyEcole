<div class="auth-layout">
    <!-- Carrousel d'images en arrière-plan -->
    <div class="auth-layout__slide" *ngFor="let slide of slides; let i = index"
         [class.is-active]="i === activeSlide"
         [style.background-image]="'url(' + slide + ')'"></div>

    <!-- Voile de contraste -->
    <div class="auth-layout__overlay"></div>

    <!-- Indicateurs du carrousel -->
    <div class="auth-layout__dots" aria-hidden="true">
        <span class="auth-layout__dot" *ngFor="let slide of slides; let i = index"
              [class.is-active]="i === activeSlide"></span>
    </div>

    <!-- Carte centrée -->
    <div class="auth-layout__card">
        <!-- Bandeau de marque -->
        <span class="auth-layout__accent" aria-hidden="true"></span>

        <!-- Logo -->
        <img class="auth-layout__logo" src="assets/images/esa.png" alt="EasyÉcole">

        <!-- Title & Subtitle -->
        <h1 class="auth-layout__title">{{ title }}</h1>
        <p class="auth-layout__subtitle">{{ subtitle }}</p>

        <!-- Formulaire -->
        <ng-content></ng-content>

        <!-- Zone basse (si showBottom) -->
        <div class="auth-layout__bottom" *ngIf="showBottom">
            <span class="auth-layout__bottom-text">{{ bottomText }}</span>
            <a [routerLink]="bottomLink" class="auth-layout__bottom-link">{{ bottomLinkText }}</a>
        </div>
    </div>

    <!-- Signature -->
    <p class="auth-layout__signature">
        <img src="assets/images/Logo%20T%26B.png" alt="Logo Technology & Business">
        <span>&copy; Easyschool @Technology&amp;Business</span>
    </p>
</div>
