<app-auth-layout title="Vérification" [subtitle]="' '"
    [showBottom]="state !== 'blocked'"
    bottomText="Vous avez déjà un compte ?" bottomLinkText="Connectez-vous" bottomLink="../connexion">

    <div class="otp-container">
        <div class="otp-header">
            <div class="otp-icon">
                <svg *ngIf="state !== 'success' && state !== 'blocked'" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1F4E79" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <svg *ngIf="state === 'success'" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                <svg *ngIf="state === 'blocked'" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <circle cx="12" cy="16" r="1"/>
                    <path d="M12 13v1"/>
                </svg>
            </div>
            <h2 class="otp-title">{{ state === 'blocked' ? 'Compte bloqué' : state === 'success' ? 'Connecté !' : 'Code à usage unique' }}</h2>
            <p class="otp-subtitle" *ngIf="state !== 'blocked' && state !== 'success'">
                Un code a été envoyé à <strong>{{ maskedEmail }}</strong>
            </p>
        </div>

        <!-- TIMER -->
        <div class="timer-section" *ngIf="state !== 'blocked' && state !== 'success'">
            <div class="timer-circle-container" [class.urgent]="isUrgent" [class.critical]="isCritical">
                <svg class="timer-circle" width="100" height="100" viewBox="0 0 100 100">
                    <circle class="timer-bg" cx="50" cy="50" r="40" fill="none" stroke="#e5e7eb" stroke-width="6"/>
                    <circle class="timer-progress" cx="50" cy="50" r="40" fill="none"
                        [attr.stroke]="timerColor"
                        stroke-width="6" stroke-linecap="round"
                        [attr.stroke-dasharray]="circleCircumference"
                        [attr.stroke-dashoffset]="dashOffset"
                        [style.transition]="'stroke-dashoffset 1s linear'"/>
                </svg>
                <span class="timer-text" [style.color]="timerColor">{{ timerText }}</span>
            </div>
        </div>

        <!-- CODE INPUTS -->
        <div class="inputs-section" *ngIf="state !== 'blocked' && state !== 'success'">
            <div class="code-inputs" [class.shake]="state === 'error'" [class.last-attempt]="isLastAttempt">
                <div *ngFor="let _ of [].constructor(4); let i = index" class="input-group">
                    <input
                        [id]="'otp-' + i"
                        class="otp-input"
                        type="text"
                        maxlength="1"
                        [value]="codeInputs[i]"
                        (input)="onInput(i, $event)"
                        (keydown)="onKeydown(i, $event)"
                        [disabled]="state === 'verifying'"
                        autocomplete="off"
                        [style.borderColor]="isLastAttempt && !codeInputs[i] ? '#ef4444' : ''"/>
                </div>
            </div>
            <p class="paste-hint">Vous pouvez coller le code complet (Ctrl+V)</p>
        </div>

        <!-- STATUS MESSAGE -->
        <div class="status-message" [class]="'status-' + statusConfig.type" *ngIf="statusConfig.text">
            <span class="status-icon">
                <svg *ngIf="statusConfig.icon === 'info'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <svg *ngIf="statusConfig.icon === 'alert'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <svg *ngIf="statusConfig.icon === 'alert-triangle'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                <svg *ngIf="statusConfig.icon === 'alert-octagon'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <svg *ngIf="statusConfig.icon === 'mail'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <svg *ngIf="statusConfig.icon === 'timer'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <svg *ngIf="statusConfig.icon === 'lock'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <svg *ngIf="statusConfig.icon === 'check'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                <svg *ngIf="statusConfig.icon === 'spinner'" class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
            </span>
            <span class="status-text" [innerHTML]="statusConfig.text"></span>
        </div>

        <!-- RESEND BUTTON -->
        <div class="resend-section" *ngIf="state !== 'blocked' && state !== 'success'">
            <button class="resend-btn" (click)="resendCode()" [disabled]="!canResend || state === 'verifying'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                <span *ngIf="canResend">Renvoyer le code</span>
                <span *ngIf="!canResend && resendCooldown > 0">Renvoyer ({{ resendCooldown }}s)</span>
            </button>
        </div>

        <!-- VERIFYING SPINNER -->
        <div class="verifying-overlay" *ngIf="state === 'verifying'">
            <div class="spinner-large"></div>
            <p>Vérification...</p>
        </div>
    </div>
</app-auth-layout>
