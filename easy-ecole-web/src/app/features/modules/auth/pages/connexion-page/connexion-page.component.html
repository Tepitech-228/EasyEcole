<app-auth-layout title="Connexion" subtitle="Veuillez entrer vos identifiants pour vous connecter" [showBottom]="true"
    bottomText="Vous n'avez pas un compte?" bottomLinkText="Inscrivez-vous" bottomLink="../inscription">

    <!-- Message d'erreur : bannière intégrée à la carte (pas d'overlay plein écran) -->
    <app-custom-alert class="w-full" [show]="error || emptyError" [inline]="true" title="Erreur">
        {{ emptyError ? 'Veuillez renseigner tous les champs.' : '' }}
        {{ error ? 'Identifiants de connexion incorrects.' : '' }}
    </app-custom-alert>

    <form [formGroup]="connexionForm" class="auth-form" (ngSubmit)="connexion()" novalidate>

        <!-- Champ : Email / Nom d'utilisateur -->
        <div class="auth-field">
            <label class="auth-label" for="usernameOrEmail">Email ou nom d'utilisateur</label>
            <div class="auth-control">
                <span class="material-symbols-outlined auth-control__icon">person</span>
                <input id="usernameOrEmail" class="auth-input" [class.auth-input--error]="connexionForm.get('usernameOrEmail')?.touched && connexionForm.get('usernameOrEmail')?.invalid"
                    type="text" formControlName="usernameOrEmail" placeholder="example@gmail.com" autocomplete="username" required />
            </div>
            <app-form-message *ngIf="connexionForm.get('usernameOrEmail')?.errors?.['required'] && connexionForm.get('usernameOrEmail')?.touched" text="Ce champ est obligatoire"></app-form-message>
        </div>

        <!-- Champ : Mot de passe -->
        <div class="auth-field">
            <div class="auth-field__head">
                <label class="auth-label" for="password">Mot de passe</label>
                <a class="auth-link" routerLink="../mot-de-passe-oublie">Mot de passe oublié ?</a>
            </div>
            <div class="auth-control">
                <span class="material-symbols-outlined auth-control__icon">lock</span>
                <input id="password" class="auth-input auth-input--password" [class.auth-input--error]="connexionForm.get('password')?.touched && connexionForm.get('password')?.invalid"
                    [type]="passwordVisible ? 'text' : 'password'" formControlName="password" placeholder="********" autocomplete="current-password" required />
                <button type="button" class="auth-control__toggle" (click)="passwordVisible = !passwordVisible"
                    [attr.aria-label]="passwordVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
                    <span class="material-symbols-outlined">{{ passwordVisible ? 'visibility_off' : 'visibility' }}</span>
                </button>
            </div>
            <app-form-message *ngIf="connexionForm.get('password')?.errors?.['required'] && connexionForm.get('password')?.touched" text="Ce champ est obligatoire"></app-form-message>
            <app-form-message *ngIf="connexionForm.get('password')?.errors?.['minlength'] && connexionForm.get('password')?.touched" text="Le mot de passe doit contenir au moins 8 caractères"></app-form-message>
        </div>

        <app-custom-button class="auth-submit" type="submit" text="Se connecter" [fullWidth]="true" [disabled]="disableButton" [loading]="disableButton"></app-custom-button>
    </form>
</app-auth-layout>
