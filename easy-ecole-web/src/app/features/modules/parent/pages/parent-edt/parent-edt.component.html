<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <h1 class="text-2xl font-bold text-gray-900">Emploi du temps</h1>
    <div *ngIf="enfants.length > 1" class="flex items-center gap-2">
      <label class="text-sm font-medium text-gray-600">Enfant :</label>
      <select
        class="px-3 py-2 border border-gray-200 rounded-xl bg-white text-sm text-gray-700 outline-none cursor-pointer"
        [ngModel]="selectedEnfant"
        (ngModelChange)="selectedEnfant = $event; onEnfantChange()">
        <option *ngFor="let e of enfants" [ngValue]="e">{{ e.prenoms }} {{ e.nom }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="selectedEnfant" class="bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 text-sm text-blue-700">
    {{ selectedEnfant.prenoms }} {{ selectedEnfant.nom }}
    <span *ngIf="selectedEnfant.classe"> — {{ selectedEnfant.classe }}</span>
  </div>

  <ng-container *ngIf="!loading; else loadingState">
    <div *ngIf="edt.length === 0" class="bg-white border border-gray-200 rounded-xl py-12 text-center text-sm text-gray-400">
      Aucun emploi du temps disponible
    </div>

    <div *ngIf="edt.length > 0" class="bg-white border border-gray-200 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full border-collapse min-w-[700px]">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200">
              <th class="py-3 px-3 text-left text-xs font-semibold text-gray-400 uppercase w-24">Horaire</th>
              <th *ngFor="let jour of jours" class="py-3 px-3 text-left text-xs font-semibold uppercase"
                [class.text-blue-600]="isToday(jour)"
                [class.text-gray-400]="!isToday(jour)">
                {{ jour }}
                <span *ngIf="isToday(jour)" class="ml-1.5 inline-block w-1.5 h-1.5 rounded-full bg-blue-500"></span>
              </th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngFor="let horaire of heureDebut">
              <tr class="border-b border-gray-100">
                <td class="py-3 px-3 text-xs font-medium text-gray-500 align-top">{{ horaire }}</td>
                <td *ngFor="let jour of jours" class="py-2 px-2 align-top">
                  <ng-container *ngFor="let cours of getCoursForJour(jour)">
                    <ng-container *ngIf="cours.horaire.startsWith(horaire)">
                      <div class="bg-blue-50 border border-blue-200 rounded-lg p-2 mb-1 text-xs"
                        [class.ring-2]="isToday(jour)"
                        [class.ring-blue-300]="isToday(jour)">
                        <p class="font-semibold text-gray-800">{{ cours.cours }}</p>
                        <p class="text-gray-500">{{ cours.horaire }}</p>
                        <p class="text-gray-500">Salle {{ cours.salle }}</p>
                        <p class="text-gray-400 truncate">{{ cours.enseignant }}</p>
                      </div>
                    </ng-container>
                  </ng-container>
                </td>
              </tr>
            </ng-container>
          </tbody>
        </table>
      </div>
    </div>
  </ng-container>

  <ng-template #loadingState>
    <div class="bg-white border border-gray-200 rounded-xl p-12 text-center text-sm text-gray-400">
      <svg class="animate-spin h-5 w-5 text-blue-500 mx-auto mb-2" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
      </svg>
      Chargement de l'emploi du temps...
    </div>
  </ng-template>
</div>
