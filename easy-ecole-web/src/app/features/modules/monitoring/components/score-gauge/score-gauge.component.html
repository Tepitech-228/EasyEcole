<div class="score-gauge" [style.border-color]="color">
  <svg viewBox="0 0 100 100" class="score-gauge__svg">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#e5e7eb" stroke-width="8" />
    <circle cx="50" cy="50" r="45" fill="none" [style.stroke]="color"
            stroke-width="8" stroke-linecap="round"
            [attr.stroke-dasharray]="strokeDasharray"
            transform="rotate(-90 50 50)" />
  </svg>
  <div class="score-gauge__center">
    <span class="score-gauge__value" [style.color]="color">{{ value }}</span>
    <span class="score-gauge__unit">{{ unit }}</span>
  </div>
  <div class="score-gauge__label">{{ label }}</div>
</div>
