<div class="flex justify-between items-start gap-x-8 mb-8">
    <app-header-title title="Fournisseurs" subtitle="Gérer les fournisseurs"></app-header-title>
    <app-custom-button text="Nouveau fournisseur" link="/achats/fournisseurs/nouveau"></app-custom-button>
</div>

<div class="mb-6 flex items-center justify-between">
    <div class="relative">
        <input type="text" [(ngModel)]="searchTerm" placeholder="Rechercher un fournisseur..." class="w-80 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm pl-10">
        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
</div>

<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<div *ngIf="!loading" class="flex flex-col">
    <div class="overflow-x-auto">
        <div class="py-2 inline-block min-w-full">
            <div class="overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th class="text-sm font-medium text-gray-900 px-2 py-4 text-left">Nom</th>
                            <th class="text-sm font-medium text-gray-900 px-2 py-4 text-left">Email</th>
                            <th class="text-sm font-medium text-gray-900 px-2 py-4 text-left">Téléphone</th>
                            <th class="text-sm font-medium text-gray-900 px-2 py-4 text-left">Ville</th>
                            <th class="text-sm font-medium text-gray-900 px-2 py-4 text-left">Statut</th>
                            <th class="text-sm font-medium text-gray-900 px-2 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngIf="fournisseurs.length==0" class="bg-white p-0 border-b">
                            <td class="text-sm text-center py-4 text-gray-600" colspan="6">Aucun fournisseur</td>
                        </tr>
                        <tr *ngFor="let f of fournisseurs" class="bg-white hover:bg-gray-100 p-0 border-b">
                            <td class="px-2 py-4 text-sm font-medium text-gray-900">{{ f.nom }}</td>
                            <td class="px-2 py-4 text-sm text-gray-600">{{ f.email }}</td>
                            <td class="px-2 py-4 text-sm text-gray-600">{{ f.telephone }}</td>
                            <td class="px-2 py-4 text-sm text-gray-600">{{ f.ville }}</td>
                            <td class="px-2 py-4 text-sm"><span class="px-2 py-1 rounded text-xs font-semibold" [ngClass]="getStatutBadge(f.statut)">{{ f.statut }}</span></td>
                            <td class="px-2 py-4 text-right">
                                <app-custom-button [link]="'/achats/fournisseurs/' + f.id" text="Détails" color="primary" size="small"></app-custom-button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
