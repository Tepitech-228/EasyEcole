<div class="mb-8">
    <app-header-title title="Nouvelle demande d'achat" subtitle="Soumettre une expression de besoin"></app-header-title>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <div class="space-y-6">
                    <div>
                        <label for="description" class="mb-2 block text-sm font-medium text-gray-700">Description du besoin</label>
                        <textarea rows="4" id="description" formControlName="description" placeholder="Décrivez votre besoin..."
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
                        <div *ngIf="form.get('description')!.invalid && (form.get('description')!.dirty || form.get('description')!.touched)" class="mt-1 text-sm text-red-600">
                            <span *ngIf="form.get('description')!.errors?.['required']">Veuillez décrire votre besoin</span>
                        </div>
                    </div>

                    <div>
                        <label for="validateurId" class="mb-2 block text-sm font-medium text-gray-700">Validateur</label>
                        <select id="validateurId" formControlName="validateurId"
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <option value="">Sélectionner un validateur</option>
                            <option value="1">M. Dupont - Niveau 1</option>
                            <option value="2">Mme Martin - Niveau 2</option>
                        </select>
                        <div *ngIf="form.get('validateurId')!.invalid && (form.get('validateurId')!.dirty || form.get('validateurId')!.touched)" class="mt-1 text-sm text-red-600">
                            <span *ngIf="form.get('validateurId')!.errors?.['required']">Veuillez sélectionner un validateur</span>
                        </div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-sm font-semibold text-gray-900">Lignes de demande</h3>
                            <button type="button" (click)="addLigne()" class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition-colors">
                                + Ajouter
                            </button>
                        </div>
                        <div class="overflow-x-auto border border-gray-200 rounded-lg">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Désignation</th>
                                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Quantité</th>
                                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Prix estimé</th>
                                        <th class="px-3 py-2 text-left text-xs font-medium text-gray-500">Unité</th>
                                        <th class="px-3 py-2 text-right text-xs font-medium text-gray-500">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                    <tr *ngFor="let l of lignes; index as i">
                                        <td class="px-3 py-2"><input type="text" [(ngModel)]="l.designation" [name]="'desg'+i" class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></td>
                                        <td class="px-3 py-2"><input type="number" [(ngModel)]="l.quantite" [name]="'qte'+i" class="w-24 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></td>
                                        <td class="px-3 py-2"><input type="number" [(ngModel)]="l.prixEstime" [name]="'prix'+i" class="w-32 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></td>
                                        <td class="px-3 py-2">
                                            <select [(ngModel)]="l.unite" [name]="'unite'+i" class="rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                                                <option>Unié</option>
                                                <option>Boîte</option>
                                                <option>Lots</option>
                                            </select>
                                        </td>
                                        <td class="px-3 py-2 text-right">
                                            <button type="button" (click)="removeLigne(i)" class="text-red-600 hover:text-red-800 text-xs font-medium">Supprimer</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div *ngIf="lignes.length === 0" class="mt-2 text-sm text-gray-500">Aucune ligne ajoutée</div>
                    </div>
                </div>

                <div class="mt-8 flex items-center justify-end gap-3">
                    <app-custom-button type="button" text="Annuler" link="/achats/demandes" color="gray" [outlined]="true"></app-custom-button>
                    <app-custom-button type="button" text="Enregistrer comme brouillon" color="gray"></app-custom-button>
                    <app-custom-button type="submit" [text]="saving ? 'Soumission...' : 'Soumettre'" [disabled]="saving"></app-custom-button>
                </div>
            </form>
        </div>
    </div>

    <div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-sm font-semibold text-gray-900 mb-3">Rappel</h3>
            <ul class="list-disc pl-5 text-sm text-gray-600 space-y-2">
                <li>Décrivez précisément le besoin.</li>
                <li>Ajoutez une ligne par article ou service.</li>
                <li>Choisissez le validateur adapté au montant.</li>
            </ul>
        </div>
    </div>
</div>
