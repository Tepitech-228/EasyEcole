<app-return-back></app-return-back>

<div class="mb-8">
    <app-header-title title="Nouveau site" subtitle="Veuillez renseigner les informations ci-dessous pour ajouter un nouveau site"></app-header-title>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <form [formGroup]="siteForm" id="siteForm">
                <div class="space-y-6">
                    <div>
                        <label for="nom" class="mb-2 block text-sm font-medium text-gray-700">Nom du site</label>
                        <input type="text" id="nom" formControlName="nom" placeholder="Ex: Campus Nord, Site principal..."
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                        <div *ngIf="siteForm.get('nom')!.invalid && (siteForm.get('nom')!.dirty || siteForm.get('nom')!.touched)" class="mt-1 text-sm text-red-600">
                            <span *ngIf="siteForm.get('nom')!.errors?.['required']">Veuillez saisir le nom</span>
                        </div>
                    </div>

                    <div>
                        <label for="adresse" class="mb-2 block text-sm font-medium text-gray-700">Adresse <span class="text-gray-400 font-normal">(facultative)</span></label>
                        <textarea rows="4" id="adresse" formControlName="adresse" placeholder="Adresse complète du site..."
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
                    </div>
                </div>

                <div class="mt-8 flex items-center justify-end gap-3">
                    <app-custom-button type="button" (click)="create()" [text]="saving ? 'Enregistrement...' : 'Enregistrer'" [disabled]="saving"></app-custom-button>
                </div>
            </form>
        </div>
    </div>

    <div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-sm font-semibold text-gray-900 mb-3">Information</h3>
            <p class="text-sm text-gray-600">Le site regroupe les immobilisations par localisation physique. Vous pourrez ensuite affecter des immobilisations à ce site.</p>
        </div>
    </div>
</div>
