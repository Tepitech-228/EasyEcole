<div class="flex justify-between items-start gap-x-8 mb-8">
    <app-header-title title="Sites" subtitle="Retrouver la liste de vos sites"></app-header-title>
    <app-custom-button *ngIf="rolesValue.isInstitution || rolesValue.isAdmin"
                       link="/immobilisations/sites/nouveau"
                       text="Nouveau site">
    </app-custom-button>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <p class="text-xs font-medium text-gray-500 uppercase">Total sites</p>
        <p class="text-xl font-bold text-gray-900 mt-1">{{ sites.length }}</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <p class="text-xs font-medium text-gray-500 uppercase">Sites actifs</p>
        <p class="text-xl font-bold text-green-600 mt-1">{{ getActiveSitesCount() }}</p>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
        <p class="text-xs font-medium text-gray-500 uppercase">Avec immobilisations</p>
        <p class="text-xl font-bold text-indigo-600 mt-1">{{ getAvecImmobilisationsCount() }}</p>
    </div>
</div>

<div class="mb-6">
    <div class="relative">
        <input type="text" [(ngModel)]="searchTerm" placeholder="Rechercher un site..." class="w-80 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm pl-10">
        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
</div>

<div class="flex flex-col">
    <div class="overflow-x-auto">
        <div class="py-2 inline-block min-w-full">
            <div class="overflow-hidden">
                <table class="min-w-full">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th scope="col" class="text-sm font-medium text-gray-900 px-2 py-4 text-left">#</th>
                            <th scope="col" class="text-sm font-medium text-gray-900 px-2 py-4 text-left">Nom</th>
                            <th scope="col" class="text-sm font-medium text-gray-900 px-2 py-4 text-left">Adresse</th>
                            <th scope="col" class="text-sm font-medium text-gray-900 px-2 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngIf="sites.length == 0" class="bg-white p-0 border-b transition duration-300 ease-in-out">
                            <td class="text-sm text-center py-4 text-gray-600 font-regular p-0 whitespace-nowrap" colspan="4">Aucun site</td>
                        </tr>
                        <tr *ngFor="let site of sites; index as index" class="bg-white hover:bg-gray-100 p-0 border-b transition duration-300 ease-in-out">
                            <td class="bg-transparent text-sm text-gray-600 font-regular p-0 whitespace-nowrap border-0 m-0 px-2">
                                <div class="block gap-x-4 border-0 m-0 px-0 py-4 text-gray-600 bg-transparent sm:text-sm sm:leading-6">{{ index + 1 }}</div>
                            </td>
                            <td class="bg-transparent text-sm text-gray-600 font-regular p-0 whitespace-nowrap border-0 m-0 px-2">
                                <div class="block w-full h-full border-0 m-0 px-2 py-4 text-gray-600 bg-transparent sm:text-sm sm:leading-6">{{ site.nom }}</div>
                            </td>
                            <td class="bg-transparent text-sm text-gray-600 font-regular p-0 whitespace-nowrap border-0 m-0 px-2">
                                <div class="block w-full h-full border-0 m-0 px-2 py-4 text-gray-600 bg-transparent sm:text-sm sm:leading-6">{{ site.adresse || '---' }}</div>
                            </td>
                            <td class="bg-transparent text-right text-sm text-gray-600 font-regular p-0 whitespace-nowrap border-0 m-0 px-2">
                                <div class="block flex justify-end gap-x-4 border-0 m-0 px-0 py-4 text-gray-600 bg-transparent sm:text-sm sm:leading-6">
                                    <app-custom-button [link]="'/immobilisations/sites/' + site.id" text="Détails" color="primary" size="small"></app-custom-button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
