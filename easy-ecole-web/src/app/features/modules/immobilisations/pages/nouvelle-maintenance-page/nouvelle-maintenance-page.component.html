<app-return-back></app-return-back>

<div class="mb-8">
    <app-header-title title="Nouvelle maintenance" subtitle="Planifier une opération de maintenance"></app-header-title>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <form [formGroup]="maintenanceForm" id="maintenanceForm">
                <div class="space-y-6">
                    <div>
                        <label for="immobilisationId" class="mb-2 block text-sm font-medium text-gray-700">Immobilisation</label>
                        <select id="immobilisationId" formControlName="immobilisationId"
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <option value="" disabled>Sélectionner une immobilisation</option>
                            <option *ngFor="let immo of immobilisations" [value]="immo.id">{{ immo.nom }}</option>
                        </select>
                        <div *ngIf="maintenanceForm.get('immobilisationId')!.invalid && (maintenanceForm.get('immobilisationId')!.dirty || maintenanceForm.get('immobilisationId')!.touched)" class="mt-1 text-sm text-red-600">
                            <span *ngIf="maintenanceForm.get('immobilisationId')!.errors?.['required']">Veuillez sélectionner une immobilisation</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="dateMaintenance" class="mb-2 block text-sm font-medium text-gray-700">Date de maintenance</label>
                            <input type="date" id="dateMaintenance" formControlName="dateMaintenance"
                                class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <div *ngIf="maintenanceForm.get('dateMaintenance')!.invalid && (maintenanceForm.get('dateMaintenance')!.dirty || maintenanceForm.get('dateMaintenance')!.touched)" class="mt-1 text-sm text-red-600">
                                <span *ngIf="maintenanceForm.get('dateMaintenance')!.errors?.['required']">Veuillez saisir la date</span>
                            </div>
                        </div>
                        <div>
                            <label for="type" class="mb-2 block text-sm font-medium text-gray-700">Type</label>
                            <input type="text" id="type" formControlName="type" placeholder="Ex: Préventive, corrective..."
                                class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <div *ngIf="maintenanceForm.get('type')!.invalid && (maintenanceForm.get('type')!.dirty || maintenanceForm.get('type')!.touched)" class="mt-1 text-sm text-red-600">
                                <span *ngIf="maintenanceForm.get('type')!.errors?.['required']">Veuillez saisir le type</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="cout" class="mb-2 block text-sm font-medium text-gray-700">Coût (FCFA)</label>
                        <input type="number" min="0" id="cout" formControlName="cout" placeholder="Saisir le coût estimé..."
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                        <div *ngIf="maintenanceForm.get('cout')!.invalid && (maintenanceForm.get('cout')!.dirty || maintenanceForm.get('cout')!.touched)" class="mt-1 text-sm text-red-600">
                            <span *ngIf="maintenanceForm.get('cout')!.errors?.['required']">Veuillez saisir le coût</span>
                            <span *ngIf="maintenanceForm.get('cout')!.errors?.['min']">Le coût doit être positif</span>
                        </div>
                    </div>

                    <div>
                        <label for="prestataire" class="mb-2 block text-sm font-medium text-gray-700">Prestataire <span class="text-gray-400 font-normal">(facultatif)</span></label>
                        <input type="text" id="prestataire" formControlName="prestataire" placeholder="Nom du prestataire"
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                    </div>

                    <div>
                        <label for="description" class="mb-2 block text-sm font-medium text-gray-700">Description <span class="text-gray-400 font-normal">(facultative)</span></label>
                        <textarea rows="4" id="description" formControlName="description" placeholder="Détails de l'intervention..."
                            class="block w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
                    </div>
                </div>

                <div class="mt-8 flex items-center justify-end gap-3">
                    <app-custom-button type="button" (click)="create()" [text]="saving ? 'Enregistrement...' : 'Enregistrer'" [disabled]="saving"></app-custom-button>
                </div>
            </form>
        </div>
    </div>

    <div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-sm font-semibold text-gray-900 mb-3">Conseils</h3>
            <ul class="list-disc pl-5 text-sm text-gray-600 space-y-2">
                <li>Sélectionnez l'immobilisation concernée.</li>
                <li>Précisez le type de maintenance.</li>
                <li>Ajoutez le prestataire si externe.</li>
            </ul>
        </div>
    </div>
</div>
