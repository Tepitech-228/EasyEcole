<div class="page-container">
  <app-header-title title="Traiter les demandes" subtitle="Gérer et traiter les demandes de documents des étudiants"></app-header-title>

  <app-custom-alert *ngIf="errorMessage" [show]="true" [title]="errorMessage" type="danger" [inline]="true"></app-custom-alert>
  <app-custom-alert *ngIf="successMessage" [show]="true" [title]="successMessage" type="success" [inline]="true"></app-custom-alert>

  <!-- Cascading filters -->
  <app-filters-annee-niveau-parcours
    [annees]="annees"
    [niveaux]="niveaux"
    [parcoursList]="parcoursList"
    [sessions]="sessions"
    [loading]="!dataLoaded"
    [showResultCount]="true"
    [resultCount]="totalItems"
    [resultLabel]="'demande(s)'"
    (filterChange)="onFilterChange($event)">
  </app-filters-annee-niveau-parcours>

  <!-- Extra filters row -->
  <div class="bg-white border border-gray-200 rounded-lg p-3 mb-4 flex items-center gap-4">
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Recherche</label>
      <input type="text" [(ngModel)]="searchQuery" (keyup)="loadDemandes()" placeholder="Nom, matricule..."
        class="form-input-sm w-48">
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Statut</label>
      <select [(ngModel)]="filterStatut" (change)="loadDemandes()" class="form-select-sm">
        <option value="">Tous</option>
        <option value="soumise">Soumise</option>
        <option value="validee">Validée</option>
        <option value="rejetee">Rejetée</option>
        <option value="delivree">Délivrée</option>
      </select>
    </div>
  </div>

  <!-- Batch toolbar -->
  <app-batch-toolbar
    [selectedCount]="selectedIds.length"
    [actions]="batchActions"
    [loading]="batchLoading"
    (action)="onBatchAction({ action: $event, ids: selectedIds })"
    (deselectAll)="selectedIds = []">
  </app-batch-toolbar>

  <!-- Dossier tree view -->
  <app-dossier-view
    [nodes]="treeNodes"
    [columns]="itemColumns"
    [batchActions]="batchActions"
    [itemActions]="itemActions"
    [renderItemActions]="true"
    [loading]="loading"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    (selectionChange)="onSelectionChange($event)"
    (batchAction)="onBatchAction($event)"
    (pageChange)="onPageChange($event)"
    (itemAction)="onItemAction($event)">
  </app-dossier-view>
</div>

<!-- Batch Rejet Modal -->
<app-custom-modal *ngIf="showRejetModal"
  [showModal]="showRejetModal"
  title="Rejeter les demandes sélectionnées"
  subtitle="Voulez-vous vraiment rejeter ces {{ selectedIds.length }} demande(s) ?"
  (onCloseModal)="showRejetModal = false">
  <div class="mb-4">
    <label class="form-label">Motif du rejet (optionnel)</label>
    <textarea [(ngModel)]="motifRejet" rows="3" class="form-textarea" placeholder="Expliquez la raison du rejet..."></textarea>
  </div>
  <div class="flex gap-4 justify-end">
    <app-custom-button (click)="showRejetModal = false" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
    <app-custom-button (click)="confirmerRejetBatch()" text="Rejeter la sélection" color="primary" [disabled]="batchLoading"></app-custom-button>
  </div>
</app-custom-modal>

<!-- Payment Collection Modal -->
<app-custom-modal *ngIf="showPaiementModal"
  [showModal]="showPaiementModal"
  title="Encaissement"
  subtitle="Confirmer le paiement au secrétariat"
  (onCloseModal)="showPaiementModal = false">
  <div class="mb-4">
    <label class="form-label">Montant (FCFA)</label>
    <input type="number" [(ngModel)]="paiementMontant" class="form-input" [readonly]="true">
  </div>
  <div class="mb-4">
    <label class="form-label">Mode de paiement</label>
    <select [(ngModel)]="paiementMode" class="form-select">
      <option value="especes">Espèces</option>
      <option value="mobile_money">Mobile Money</option>
      <option value="autre">Autre</option>
    </select>
  </div>
  <div class="flex gap-4 justify-end">
    <app-custom-button (click)="showPaiementModal = false" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
    <app-custom-button (click)="submitPaiement()" text="Confirmer l'encaissement" color="green" [disabled]="batchLoading"></app-custom-button>
  </div>
</app-custom-modal>
