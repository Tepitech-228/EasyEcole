<div class="p-6">
  <app-header-title title="Caisse" subtitle="Reçus de paiement et journal de caisse"></app-header-title>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <div *ngIf="!loading" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left font-medium text-gray-600">N° Reçu</th>
          <th class="px-4 py-3 text-left font-medium text-gray-600">Étudiant</th>
          <th class="px-4 py-3 text-left font-medium text-gray-600">Document</th>
          <th class="px-4 py-3 text-right font-medium text-gray-600">Montant</th>
          <th class="px-4 py-3 text-left font-medium text-gray-600">Mode</th>
          <th class="px-4 py-3 text-left font-medium text-gray-600">Date</th>
          <th class="px-4 py-3 text-center font-medium text-gray-600">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let r of recus" class="hover:bg-gray-50">
          <td class="px-4 py-3 font-medium text-gray-900">{{ r.numero }}</td>
          <td class="px-4 py-3 text-gray-600">{{ r.demande?.etudiant?.nom }} {{ r.demande?.etudiant?.prenoms }}</td>
          <td class="px-4 py-3 text-gray-600">{{ r.demande?.typeDocument?.libelle || '---' }}</td>
          <td class="px-4 py-3 text-right text-gray-900">{{ r.montant | number:'1.0-0' }} FCFA</td>
          <td class="px-4 py-3 text-gray-600">{{ r.modePaiement }}</td>
          <td class="px-4 py-3 text-gray-600">{{ r.datePaiement | date:'dd/MM/YYYY' }}</td>
          <td class="px-4 py-3 text-center">
            <button (click)="printRecu(r.id)" class="text-indigo-600 hover:text-indigo-800">Imprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
