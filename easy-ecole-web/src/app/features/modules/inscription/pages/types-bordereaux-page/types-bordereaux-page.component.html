<div class="p-6">
  <app-header-title title="Types d'opérations" subtitle="Gérez les types d'opérations financières pour les bordereaux"></app-header-title>

  <div class="mb-4">
    <app-custom-button (click)="openCreate()" text="Nouveau type" color="primary"></app-custom-button>
  </div>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <div *ngIf="!loading && types.length === 0" class="bg-white rounded-lg border border-gray-200 p-8 text-center">
    <p class="text-gray-500 text-sm">Aucun type d'opération défini</p>
  </div>

  <div *ngIf="!loading && types.length > 0" class="bg-white rounded-lg border border-gray-200 overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-3 text-left font-medium text-gray-600">Code</th>
          <th class="px-4 py-3 text-left font-medium text-gray-600">Libellé</th>
          <th class="px-4 py-3 text-center font-medium text-gray-600">Actif</th>
          <th class="px-4 py-3 text-center font-medium text-gray-600">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let t of types" class="hover:bg-gray-50">
          <td class="px-4 py-3 font-medium text-gray-900">{{ t.code }}</td>
          <td class="px-4 py-3 text-gray-600">{{ t.libelle }}</td>
          <td class="px-4 py-3 text-center">
            <button (click)="toggleActif(t)" title="Cliquer pour activer/désactiver"
              class="inline-flex items-center gap-1 px-2 py-1 text-xs font-medium rounded-full transition focus:outline-none focus:ring-2 focus:ring-offset-1"
              [class.bg-green-100]="t.actif" [class.text-green-700]="t.actif"
              [class.bg-gray-100]="!t.actif" [class.text-gray-500]="!t.actif">
              <span class="material-symbols-outlined text-sm">{{ t.actif ? 'check_circle' : 'cancel' }}</span>
              {{ t.actif ? 'Actif' : 'Inactif' }}
            </button>
          </td>
          <td class="px-4 py-3 text-center whitespace-nowrap">
            <button (click)="openEdit(t)" title="Modifier le type"
              class="inline-flex items-center gap-1 px-2.5 py-1 mr-2 text-xs font-medium rounded-md transition text-blue-700 bg-blue-100 hover:bg-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-300">
              <span class="material-symbols-outlined text-sm">edit</span>
              Modifier
            </button>
            <button (click)="deleteItem(t.id)" title="Supprimer le type"
              class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium rounded-md transition text-red-700 bg-red-100 hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-red-300">
              <span class="material-symbols-outlined text-sm">delete</span>
              Supprimer
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<app-custom-modal
  [title]="isEditing ? 'Modifier le type' : 'Nouveau type'"
  subtitle="Définissez le code et le libellé de l'opération"
  (onCloseModal)="closeModal()"
  [center]="true"
  [showModal]="showModal">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Code *</label>
        <input type="text" formControlName="code" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex: INSCRIPTION">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Libellé *</label>
        <input type="text" formControlName="libelle" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex: Frais d'inscription">
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" formControlName="actif" class="h-4 w-4 text-indigo-600 border-gray-300 rounded">
        <label class="text-sm text-gray-700">Actif</label>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <app-custom-button type="button" (click)="closeModal()" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
      <app-custom-button type="submit" [text]="isEditing ? 'Enregistrer' : 'Créer'" [disabled]="form.invalid"></app-custom-button>
    </div>
  </form>
</app-custom-modal>
