<div class="flex justify-between items-start mb-8">
    <app-header-title title="Effectifs inscrits" subtitle="Consulter les étudiants inscrits par année, niveau, parcours et classe"></app-header-title>
</div>

<div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    Une erreur est survenue lors du chargement
</div>

<!-- Filtres -->
<div class="bg-white border border-gray-200 rounded-lg p-4 mb-6">
    <div class="flex items-center gap-x-2 mb-4">
        <span class="material-symbols-outlined text-gray-500">folder_open</span>
        <span class="text-sm font-medium text-gray-700">Filtrer les effectifs</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-x-4 gap-y-3">
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm align-text-bottom mr-1">calendar_month</span>
                Année académique
            </label>
            <select [(ngModel)]="selectedAnneeId" (change)="onFilterChange({ anneeId: selectedAnneeId, niveauId: selectedNiveauId, parcoursId: selectedParcoursId })"
                class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm text-gray-900 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                <option value="">-- Toutes les années --</option>
                <option *ngFor="let a of annees" [value]="a.id">{{ a.libelle }}</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm align-text-bottom mr-1">school</span>
                Niveau d'étude
            </label>
            <select [(ngModel)]="selectedNiveauId" (change)="onFilterChange({ anneeId: selectedAnneeId, niveauId: selectedNiveauId, parcoursId: selectedParcoursId })"
                [disabled]="!selectedAnneeId"
                class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm text-gray-900 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed">
                <option value="">-- Tous les niveaux --</option>
                <option *ngFor="let n of niveauxFiltres" [value]="n.id">{{ n.libelle }}</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm align-text-bottom mr-1">route</span>
                Parcours
            </label>
            <select [(ngModel)]="selectedParcoursId" (change)="onFilterChange({ anneeId: selectedAnneeId, niveauId: selectedNiveauId, parcoursId: selectedParcoursId })"
                [disabled]="!selectedNiveauId"
                class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm text-gray-900 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed">
                <option value="">-- Tous les parcours --</option>
                <option *ngFor="let p of parcoursFiltres" [value]="p.id">{{ p.titre }}</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm align-text-bottom mr-1">group</span>
                Classe
            </label>
            <select [(ngModel)]="selectedClasseId" (change)="onClasseChange()"
                [disabled]="!selectedParcoursId"
                class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm text-gray-900 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed">
                <option value="">-- Toutes les classes --</option>
                <option *ngFor="let c of classesFiltres" [value]="c.id">{{ c.libelle }}</option>
            </select>
        </div>
    </div>
</div>

<!-- Barre de recherche -->
<div class="bg-white border border-gray-200 rounded-lg p-4 mb-6">
    <div class="flex items-center gap-x-4">
        <div class="flex-1">
            <label class="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm align-text-bottom mr-1">search</span>
                Rechercher un étudiant
            </label>
            <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()"
                placeholder="Nom, prénom..."
                class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm text-gray-900 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
        </div>
        <div class="flex-shrink-0 pt-6">
            <div class="bg-gradient-to-r from-indigo-50 to-indigo-100 border border-indigo-200 rounded-md px-4 py-2.5 text-center">
                <p class="text-xs text-indigo-600 font-semibold">TOTAL</p>
                <p class="text-lg font-bold text-indigo-600">{{ total }}</p>
                <p class="text-xs text-indigo-500">inscrit(s)</p>
            </div>
        </div>
    </div>
</div>

<!-- Dossier tree view -->
<app-dossier-view
    [nodes]="treeNodes"
    [columns]="columns"
    [batchActions]="batchActions"
    [loading]="loading"
    [totalItems]="total"
    [currentPage]="page"
    [totalPages]="totalPages"
    [pageSize]="limit"
    [renderItemActions]="false"
    (pageChange)="onPageChange($event)"
    (batchAction)="onBatchAction($event)">
</app-dossier-view>
