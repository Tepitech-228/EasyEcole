<app-header-title title="Comité d'orientation" description="Gérer les préinscriptions des étudiants"></app-header-title>

<app-custom-alert *ngIf="errorMessage" [show]="true" [title]="errorMessage" type="danger" [inline]="true"></app-custom-alert>

<div class="mt-6 flex flex-col gap-y-4">
  <!-- Cascading filters -->
  <app-filters-annee-niveau-parcours
    [annees]="annees"
    [niveaux]="niveaux"
    [parcoursList]="parcoursList"
    [sessions]="sessions"
    [loading]="!dataLoaded"
    [showResultCount]="true"
    [resultCount]="totalItems"
    [resultLabel]="'préinscription(s)'"
    (filterChange)="onFilterChange($event)">
  </app-filters-annee-niveau-parcours>

  <!-- Extra filters -->
  <div class="bg-white border border-gray-200 rounded-lg p-3 flex items-center gap-4">
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Recherche</label>
      <input type="text" [(ngModel)]="searchQuery" (keyup)="getDemandes()" placeholder="Nom, matricule..."
        class="form-input-sm w-48">
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Statut</label>
      <select [(ngModel)]="filterStatut" (change)="getDemandes()" class="form-select-sm">
        <option value="">Tous</option>
        <option value="en_attente">En attente</option>
        <option value="valide">Validée</option>
        <option value="rejete">Rejetée</option>
      </select>
    </div>
  </div>

  <!-- Batch toolbar -->
  <app-batch-toolbar
    [selectedCount]="selectedIds.length"
    [actions]="batchActions"
    [loading]="batchLoading"
    (action)="onBatchAction({ action: $event, ids: selectedIds })"
    (deselectAll)="selectedIds = []">
  </app-batch-toolbar>

  <!-- Dossier tree view -->
  <app-dossier-view
    [nodes]="treeNodes"
    [columns]="itemColumns"
    [batchActions]="batchActions"
    [loading]="loading"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [renderItemActions]="true"
    (selectionChange)="onSelectionChange($event)"
    (batchAction)="onBatchAction($event)"
    (pageChange)="onPageChange($event)"
    (itemAction)="onItemAction($event)">
  </app-dossier-view>
</div>

<!-- Modal confirmation -->
<app-custom-modal *ngIf="showReponseModal"
  [showModal]="showReponseModal"
  [title]="(actionEnCours == 'valider' ? 'Valider' : 'Rejeter') + ' les préinscriptions sélectionnées'"
  [subtitle]="'Voulez-vous vraiment ' + (actionEnCours == 'valider' ? 'valider' : 'rejeter') + ' ces ' + selectedIds.length + ' préinscriptions ?'"
  (onCloseModal)="showReponseModal = false">
  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700 mb-1">Commentaire (optionnel)</label>
    <textarea [(ngModel)]="commentaireReponse"
      class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm"
      rows="3" placeholder="Ajouter un commentaire..."></textarea>
  </div>
  <div class="flex justify-end gap-x-3">
    <app-custom-button (click)="showReponseModal = false" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
    <app-custom-button (click)="confirmerAction()"
      [text]="actionEnCours == 'valider' ? 'Valider la sélection' : 'Rejeter la sélection'"
      [color]="actionEnCours == 'valider' ? 'green' : 'red'"
      [disabled]="batchLoading">
    </app-custom-button>
  </div>
</app-custom-modal>

<!-- Modal documents -->
<app-custom-modal *ngIf="showDocumentsModal"
  [showModal]="showDocumentsModal"
  [title]="selectedDemandeTitle"
  subtitle="Documents téléversés par l'étudiant"
  (onCloseModal)="closeDocumentsModal()">
  <div class="py-2">
    <div *ngIf="selectedDemandeDocs.length === 0" class="text-sm text-gray-500 py-4 text-center">
      Aucun document téléversé
    </div>
    <div *ngFor="let doc of selectedDemandeDocs" class="flex items-center justify-between py-3 border-b border-gray-100 last:border-0">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-gray-400">description</span>
        <div>
          <p class="text-sm font-medium text-gray-800">{{ doc.dossierInscription?.titre || 'Document' }}</p>
          <p class="text-xs text-gray-500">{{ doc.nomFichier }}</p>
        </div>
      </div>
      <a [href]="DOCUMENTS_URL + doc.nomFichier" target="_blank"
        class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-medium text-blue-700 bg-blue-100 rounded-md hover:bg-blue-200 transition">
        <span class="material-symbols-outlined text-sm">visibility</span>
        Voir
      </a>
    </div>
  </div>
  <div class="flex justify-end pt-3">
    <app-custom-button (click)="closeDocumentsModal()" text="Fermer" color="gray" [outlined]="true"></app-custom-button>
  </div>
</app-custom-modal>
