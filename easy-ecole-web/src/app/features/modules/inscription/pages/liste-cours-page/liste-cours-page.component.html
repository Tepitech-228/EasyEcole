<div class="flex justify-between items-start mb-8">
    <app-header-title title="Cours" subtitle="Retrouver la liste de vos cours"></app-header-title>
    <div class="flex justify-end items-center">
        <app-custom-button text="Valider"></app-custom-button>
    </div>
</div>

<app-filters-annee-niveau-parcours
    [annees]="annees"
    [niveaux]="niveaux"
    [parcoursList]="parcoursList"
    [sessions]="sessions"
    [loading]="loading"
    [resultCount]="totalItems"
    resultLabel="cours"
    (filterChange)="onFilterChange($event)">
</app-filters-annee-niveau-parcours>

<div class="bg-white border border-gray-200 rounded-lg p-4 mb-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-3">
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm align-text-bottom mr-1">calendar_view_week</span>
                Semestre
            </label>
            <select [(ngModel)]="selectedSemestre" (change)="onSemestreChange()"
                class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm text-gray-900 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                <option value="">-- Tous les semestres --</option>
                <option *ngFor="let s of semestres" [value]="s">{{ s }}</option>
            </select>
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-600 mb-2 uppercase tracking-wider">
                <span class="material-symbols-outlined text-sm align-text-bottom mr-1">group</span>
                Classe
            </label>
            <select [(ngModel)]="selectedClasseId" (change)="onClasseChange()"
                class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm text-gray-900 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                <option value="">-- Toutes les classes --</option>
                <option *ngFor="let c of classes" [value]="c.id">{{ c.libelle }}</option>
            </select>
        </div>
    </div>
</div>

<app-dossier-view
    [nodes]="nodes"
    [columns]="columns"
    [loading]="loading"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    (pageChange)="onPageChange($event)"
    (itemAction)="openEditerCoursModal($event.item)">
</app-dossier-view>

<!-- Modals -->
<app-custom-modal title="Nouvelle cours" subtitle="Ajouter une nouvelle cours à votre catalogue" (onCloseModal)="showNouveaucoursModal = false" [center]="true" [showModal]="showNouveaucoursModal">
    <form [formGroup]="coursForm">
        <div class="mb-6">
            <span class="mb-2 block text-sm text-gray-400">Titre</span>
            <input type="text" id="titre" formControlName="titre" placeholder="Saisir le titre ici..."
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">

            <div class="mb-8"
                *ngIf="coursForm.get('titre')!.invalid && (coursForm.get('titre')!.dirty || coursForm.get('titre')!.touched)">
                <app-form-message *ngIf="coursForm.get('titre')!.errors?.['required']"
                    text="Veuillez saisir le titre"></app-form-message>
            </div>
        </div>
        <div class="mb-6">
            <span class="mb-2 block text-sm text-gray-600">Filière d'étude</span>
            <select id="parcours" formControlName="parcours"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
            </select>
            <div *ngIf="coursForm.get('parcours')!.invalid && (coursForm.get('parcours')!.dirty || coursForm.get('parcours')!.touched)">
                <app-form-message *ngIf="coursForm.get('parcours')!.errors?.['required']"
                    text="Veuillez saisir la filière d'étude"></app-form-message>
            </div>
        </div>
        <div class="mb-6">
            <span class="mb-2 block text-sm text-gray-400">Description (facultative)</span>
            <textarea rows="5" id="description" formControlName="description"
                placeholder="Saisir la description ici..."
                class="w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"></textarea>
        </div>
    </form>
    <div class="flex items-center justify-between py-3">
        <app-custom-button (click)="closeNouveaucoursModal()" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
        <app-custom-button (click)="ajouterCours()" text="Enregistrer"></app-custom-button>
    </div>
</app-custom-modal>

<app-custom-modal *ngIf="selectedCours" title="Editer" subtitle="Mettre à jour les incours de cette cours" (onCloseModal)="showEditerCoursModal = false" [center]="true" [showModal]="showEditerCoursModal">
    <form [formGroup]="coursForm">
        <div class="mb-6">
            <span class="mb-2 block text-sm text-gray-400">Titre</span>
            <input type="text" id="titre" formControlName="titre" placeholder="Saisir le titre ici..."
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">

            <div class="mb-8"
                *ngIf="coursForm.get('titre')!.invalid && (coursForm.get('titre')!.dirty || coursForm.get('titre')!.touched)">
                <app-form-message *ngIf="coursForm.get('titre')!.errors?.['required']"
                    text="Veuillez saisir le titre"></app-form-message>
            </div>
        </div>
        <div class="mb-6">
            <span class="mb-2 block text-sm text-gray-600">Filière d'étude</span>
            <select id="parcours" formControlName="parcours"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
            </select>
            <div *ngIf="coursForm.get('parcours')!.invalid && (coursForm.get('parcours')!.dirty || coursForm.get('parcours')!.touched)">
                <app-form-message *ngIf="coursForm.get('parcours')!.errors?.['required']"
                    text="Veuillez saisir la filière d'étude"></app-form-message>
            </div>
        </div>
        <div class="mb-6">
            <span class="mb-2 block text-sm text-gray-400">Description (facultative)</span>
            <textarea rows="5" id="description" formControlName="description"
                placeholder="Saisir la description ici..."
                class="w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:bg-white focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"></textarea>
        </div>
    </form>
    <div class="flex items-center justify-between py-3">
        <app-custom-button (click)="showEditerCoursModal = false" text="Annuler" [outlined]="true" color="gray"></app-custom-button>
        <app-custom-button text="Modifier"></app-custom-button>
    </div>
</app-custom-modal>

<app-custom-modal *ngIf="selectedCours" title="Supprimer" subtitle="Déplacer cette cours dans la corbeille. Voulez-vous continuer ?" (onCloseModal)="showSupprimerCoursModal = false" [center]="true" [showModal]="showSupprimerCoursModal">
    <div class="flex items-center justify-between py-30">
        <app-custom-button (click)="showSupprimerCoursModal = false" text="Annuler" [outlined]="true" color="gray"></app-custom-button>
        <app-custom-button text="Supprimer" color="primary"></app-custom-button>
    </div>
</app-custom-modal>
