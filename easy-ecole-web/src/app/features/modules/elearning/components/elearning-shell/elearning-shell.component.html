<div class="learning-shell">
  <aside class="learning-sidebar">
    <a class="learning-brand" routerLink="/elearning/dashboard" aria-label="Accueil e-learning">
      <span class="learning-brand-mark">
        <img src="assets/images/logo-esa.svg" alt="ESA — In God we trust">
      </span>
    </a>

    <div class="learning-nav-scroll">
      <p class="learning-nav-caption">APPRENDRE</p>
      <nav class="learning-nav" aria-label="Navigation étudiant">
        <a *ngFor="let item of studentNavItems" [routerLink]="item.route" routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }" class="learning-nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path [attr.d]="item.icon"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      </nav>

      <ng-container *ngIf="canManage">
        <p class="learning-nav-caption learning-admin-caption">ADMINISTRATION</p>
        <nav class="learning-nav" aria-label="Administration e-learning">
          <a *ngFor="let item of adminNavItems" [routerLink]="item.route" routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }" class="learning-nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path [attr.d]="item.icon"></path>
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </nav>
      </ng-container>
    </div>

    <div class="learning-sidebar-footer">
      <div class="learning-support-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <path d="M4 13v-2a8 8 0 0 1 16 0v2M4 13h3v6H6a2 2 0 0 1-2-2v-4ZM20 13h-3v6h1a2 2 0 0 0 2-2v-4ZM17 19a5 5 0 0 1-5 2h-1"></path>
        </svg>
      </div>
      <div>
        <strong>Besoin d’aide ?</strong>
        <span>Votre équipe pédagogique est là.</span>
      </div>
    </div>
  </aside>

  <div class="learning-main">
    <header class="learning-topbar">
      <div class="learning-topbar-heading">
        <p class="learning-breadcrumb">CAMPUS NUMÉRIQUE <span>/</span> {{ pageTitle | uppercase }}</p>
        <h1>{{ pageTitle }}</h1>
      </div>
      <div class="learning-topbar-meta">
        <span class="learning-live"><i></i> Plateforme active</span>
        <span class="learning-user-mark" aria-label="Espace sécurisé">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3 5 6v5c0 4.5 2.8 8 7 10 4.2-2 7-5.5 7-10V6l-7-3Z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </span>
      </div>
    </header>

    <nav class="learning-mobile-nav" aria-label="Navigation e-learning">
      <a *ngFor="let item of studentNavItems" [routerLink]="item.route" routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }">{{ item.label }}</a>
      <a *ngFor="let item of (canManage ? adminNavItems : [])" [routerLink]="item.route"
        routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">{{ item.label }}</a>
    </nav>

    <main class="learning-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
