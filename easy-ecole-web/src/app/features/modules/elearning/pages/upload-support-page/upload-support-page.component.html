<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <a routerLink=".." class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-indigo-600 mb-4 transition-colors">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Retour au cours
  </a>

  <app-header-title title="Uploader un support" subtitle="Ajoutez une vidéo, un PDF ou un document à un module"></app-header-title>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Module</label>
        <select [(ngModel)]="selectedModuleId" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
          <option value="">Sélectionnez un module</option>
          <option *ngFor="let m of modules" [value]="m.id">{{ m.titre }}</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Type de support</label>
        <select [(ngModel)]="supportType" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500">
          <option value="document">Document</option>
          <option value="video">Vidéo</option>
          <option value="pdf">PDF</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Fichier</label>
        <input (change)="onFileSelected($event)" type="file" class="w-full text-sm text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
      </div>
    </div>

    <div *ngIf="successMessage" class="bg-green-50 border border-green-100 rounded-xl p-3 text-sm text-green-700 mb-4">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-100 rounded-xl p-3 text-sm text-red-700 mb-4">{{ errorMessage }}</div>

    <app-custom-button (click)="upload()" [disabled]="uploading || !selectedFile || !selectedModuleId" [text]="uploading ? 'Upload en cours...' : 'Uploader'" color="indigo" [fullWidth]="true"></app-custom-button>
  </div>
</div>
