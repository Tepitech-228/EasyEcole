<div class="mx-auto max-w-3xl space-y-5">
  <a routerLink=".." class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 transition hover:text-indigo-600">
    <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Retour au cours
  </a>

  <section class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-600 px-6 py-8 text-white shadow-xl shadow-indigo-200 sm:px-8">
    <div class="pointer-events-none absolute -right-16 -top-20 h-56 w-56 rounded-full bg-white/10 blur-2xl"></div>
    <div class="relative flex items-center gap-4">
      <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-white/15 ring-1 ring-inset ring-white/20">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V4m0 0 4 4m-4-4-4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
      </span>
      <div>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Uploader un support</h1>
        <p class="mt-1 text-sm text-indigo-100">Ajoutez une vidéo, un PDF ou un document à un module.</p>
      </div>
    </div>
  </section>

  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
    <div class="space-y-4">
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-600" for="support-module">Module</label>
        <select id="support-module" [(ngModel)]="selectedModuleId"
          class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20">
          <option value="">Sélectionnez un module</option>
          <option *ngFor="let m of modules" [value]="m.id">{{ m.titre }}</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-600" for="support-type">Type de support</label>
        <select id="support-type" [(ngModel)]="supportType" (ngModelChange)="onSupportTypeChange()"
          class="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20">
          <option value="document">Document</option>
          <option value="video">Vidéo</option>
          <option value="pdf">PDF</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-600" for="support-file">Fichier</label>
        <input id="support-file" (change)="onFileSelected($event)" type="file" [attr.accept]="acceptedFileTypes"
          class="w-full text-xs text-slate-500 file:mr-3 file:rounded-lg file:border-0 file:bg-indigo-50 file:px-3 file:py-1.5 file:text-xs file:font-semibold file:text-indigo-700 hover:file:bg-indigo-100" />
        <small *ngIf="supportType === 'video'" class="mt-1 block text-[11px] text-slate-400">Formats acceptés : MP4, WebM et Ogg (50 Mo maximum).</small>
      </div>
    </div>

    <div *ngIf="successMessage" class="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="mt-4 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700">{{ errorMessage }}</div>

    <div class="mt-5">
      <app-custom-button (click)="upload()" [disabled]="uploading || !selectedFile || !selectedModuleId" [text]="uploading ? 'Upload en cours...' : 'Uploader'" color="indigo" [fullWidth]="true"></app-custom-button>
    </div>
  </div>
</div>
