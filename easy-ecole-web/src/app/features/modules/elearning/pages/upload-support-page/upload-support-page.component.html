<div class="upload-page">
  <a routerLink=".." class="upload-page__back">&larr; Retour</a>

  <div class="upload-page__card">
    <h2 class="upload-page__title">Uploader un support</h2>

    <div class="form-group">
      <label class="form-label">Module</label>
      <select [(ngModel)]="selectedModuleId" class="form-select">
        <option value="">Sélectionnez un module</option>
        <option *ngFor="let m of modules" [value]="m.id">{{ m.titre }}</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Type de support</label>
      <select [(ngModel)]="supportType" class="form-select">
        <option value="document">Document</option>
        <option value="video">Vidéo</option>
        <option value="pdf">PDF</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Fichier</label>
      <input type="file" (change)="onFileSelected($event)" class="form-input">
    </div>

    <div *ngIf="successMessage" class="alert alert--success">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="alert alert--danger">{{ errorMessage }}</div>

    <button (click)="upload()" [disabled]="uploading || !selectedFile || !selectedModuleId" class="btn btn--primary btn--full">
      {{ uploading ? 'Upload en cours...' : 'Uploader' }}
    </button>
  </div>
</div>
