<div class="gestion-page">
  <div class="gestion-page__header">
    <h2 class="gestion-page__title">Gestion e-learning</h2>
    <button (click)="toggleCreateForm()" class="btn btn--primary">
      {{ showCreateForm ? 'Annuler' : 'Nouveau cours' }}
    </button>
  </div>

  <div *ngIf="showCreateForm" class="card">
    <h3 class="card__title">Créer un nouveau cours</h3>
    <div class="form-group">
      <label class="form-label">Titre</label>
      <input [(ngModel)]="newCours.titre" type="text" class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea [(ngModel)]="newCours.description" class="form-textarea"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Format</label>
        <select [(ngModel)]="newCours.format" class="form-select">
          <option value="video">Vidéo</option>
          <option value="pdf">PDF</option>
          <option value="mixte">Mixte</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Professeur</label>
        <select [(ngModel)]="newCours.enseignantId" class="form-select">
          <option [ngValue]="null">— Sélectionner —</option>
          <option *ngFor="let e of enseignants" [ngValue]="e.utilisateur?.id || e.id">
            {{ e.utilisateur?.prenoms || e.prenoms }} {{ e.utilisateur?.nom || e.nom }}
          </option>
        </select>
      </div>
    </div>
    <button (click)="createCours()" [disabled]="!newCours.titre" class="btn btn--primary">
      Créer
    </button>
  </div>

  <div *ngIf="loading" class="spinner-wrapper">
    <div class="spinner"></div>
  </div>

  <div *ngIf="!loading" class="card">
    <div class="table-wrapper">
      <table class="table">
        <thead>
          <tr>
            <th>Titre</th>
            <th>Format</th>
            <th>Professeur</th>
            <th>Statut</th>
            <th>Modules</th>
            <th class="table__th--right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cours of coursList">
            <td>
              <a [routerLink]="['/elearning', cours.id]" class="table__link">{{ cours.titre }}</a>
            </td>
            <td>
              <span class="badge badge--format" [class.badge--video]="cours.format === 'video'" [class.badge--pdf]="cours.format === 'pdf'" [class.badge--mixte]="cours.format === 'mixte'">{{ cours.format || 'mixte' }}</span>
            </td>
            <td class="table__muted">{{ cours.enseignant?.prenoms }} {{ cours.enseignant?.nom }}</td>
            <td>
              <span class="badge" [ngClass]="cours.statut === 'actif' ? 'badge--success' : 'badge--muted'">{{ cours.statut }}</span>
            </td>
            <td class="table__muted">{{ cours.modules?.length || 0 }}</td>
            <td class="table__td--right">
              <a [routerLink]="['/elearning', cours.id, 'upload']" class="table__action-link">Upload</a>
              <button (click)="deleteCours(cours.id)" class="table__action-link table__action-link--danger">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div *ngIf="coursList.length === 0" class="table__empty">Aucun cours e-learning.</div>
  </div>
</div>
