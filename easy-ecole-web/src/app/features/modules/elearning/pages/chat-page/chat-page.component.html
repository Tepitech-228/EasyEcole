<div class="chat-page">
  <div class="chat-page__header">
    <a routerLink=".." class="chat-page__back">&larr; Retour</a>
    <h2 class="chat-page__title">Salons de discussion</h2>
  </div>

  <div class="chat-page__body">
    <div class="chat-page__sidebar">
      <h3 class="chat-page__sidebar-title">Salons</h3>
      <div *ngIf="loading" class="chat-page__loading">Chargement...</div>
      <ul *ngIf="!loading" class="chat-page__list">
        <li *ngFor="let salon of salons"
            (click)="selectSalon(salon)"
            class="salon-item"
            [ngClass]="{'salon-item--active': selectedSalon?.id === salon.id}">
          <span class="salon-item__name">{{ salon.titre }}</span>
          <span class="salon-item__type">{{ salon.type }}</span>
        </li>
        <li *ngIf="salons.length === 0" class="chat-page__empty">Aucun salon disponible.</li>
      </ul>
    </div>

    <div class="chat-page__main">
      <app-chat-window *ngIf="selectedSalon" [salon]="selectedSalon"></app-chat-window>
      <div *ngIf="!selectedSalon" class="chat-page__placeholder">
        Sélectionnez un salon pour commencer à discuter.
      </div>
    </div>
  </div>
</div>
