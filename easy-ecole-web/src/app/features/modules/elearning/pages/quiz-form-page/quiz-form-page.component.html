<div class="quiz-form-page">
  <h2 class="quiz-form-page__title">{{ isEdit ? 'Modifier le quiz' : 'Créer un nouveau quiz' }}</h2>

  <div class="card">
    <form [formGroup]="quizForm" (ngSubmit)="onSubmit()">
      <div class="quiz-form-page__row">
        <div class="form-group">
          <label class="form-label">Titre du quiz</label>
          <input formControlName="titre" type="text" class="form-input" placeholder="Ex: Algèbre - Chapitre 1">
          <div *ngIf="submitted && quizForm.get('titre')?.invalid" class="alert alert--danger">Le titre est requis</div>
        </div>
        <div class="form-group">
          <label class="form-label">Temps limite (minutes)</label>
          <input formControlName="tempsLimite" type="number" min="1" class="form-input form-input--short">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea formControlName="description" rows="3" class="form-textarea" placeholder="Décrivez le contenu du quiz"></textarea>
        <div *ngIf="submitted && quizForm.get('description')?.invalid" class="alert alert--danger">La description est requise</div>
      </div>

      <div class="quiz-form-page__section">
        <div class="quiz-form-page__section-header">
          <h3 class="quiz-form-page__section-title">Questions</h3>
          <button type="button" (click)="addQuestion()" class="btn btn--primary">Ajouter une question</button>
        </div>

        <div formArrayName="questions">
          <div *ngFor="let question of questions.controls; let i = index" [formGroupName]="i" class="question-card">
            <div class="question-card__header">
              <h4 class="question-card__title">Question {{ i + 1 }}</h4>
              <button *ngIf="questions.length > 1" type="button" (click)="removeQuestion(i)" class="btn btn--outline btn--outline-danger">Supprimer</button>
            </div>
            <div class="form-group">
              <label class="form-label">Texte de la question</label>
              <input formControlName="texte" type="text" class="form-input" placeholder="Ex: Quelle est la solution de 2x+5=13 ?">
            </div>
            <div class="form-group">
              <label class="form-label">Options (séparées par des virgules)</label>
              <input formControlName="options" type="text" class="form-input" placeholder="Ex: x=2, x=4, x=6, x=8">
            </div>
            <div class="form-group">
              <label class="form-label">Bonne réponse (index 0-3)</label>
              <input formControlName="reponseCorrecte" type="number" min="0" max="3" class="form-input form-input--short">
            </div>
          </div>
        </div>

        <div *ngIf="submitted && questions.invalid" class="alert alert--danger">Ajoutez au moins une question valide</div>
      </div>

      <div class="quiz-form-page__actions">
        <button type="submit" class="btn btn--primary">{{ isEdit ? 'Enregistrer' : 'Créer le quiz' }}</button>
        <button type="button" (click)="cancel()" class="btn btn--outline">Annuler</button>
      </div>
    </form>
  </div>
</div>
