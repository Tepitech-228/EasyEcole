<div class="dashboard-surface dashboard-admin-shell">
  <div class="dashboard-banner admin-banner">
    <div>
      <p class="dashboard-kicker">Administration</p>
      <h1 class="text-2xl font-bold text-white">Tableau de bord Admin</h1>
    </div>
  </div>

  <ng-container *ngIf="!loading && !error; else loadingState">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div *ngFor="let s of stats" [routerLink]="s.link" class="dashboard-stat-card cursor-pointer group">
        <div class="flex items-center justify-between">
          <div>
            <p class="dashboard-card-label">{{ s.label }}</p>
            <p class="dashboard-card-number small group-hover:text-indigo-600 transition-colors">{{ s.value }}</p>
          </div>
          <div class="p-3 rounded-full" [class]="'bg-' + s.color + '-50'">
            <span class="material-icons text-2xl" [class]="'text-' + s.color + '-600'">{{ s.icon }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Actions rapides</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <a *ngFor="let q of quickLinks" [routerLink]="q.link" class="flex items-center gap-x-4 p-4 bg-gray-50 rounded-lg hover:bg-indigo-50 hover:border-indigo-200 border border-gray-100 transition-colors">
            <div class="p-2 bg-white rounded-lg shadow-sm">
              <span class="material-symbols-outlined text-indigo-600">{{ q.icon }}</span>
            </div>
            <div>
              <p class="text-sm font-semibold text-gray-900">{{ q.label }}</p>
              <p class="text-xs text-gray-500">{{ q.desc }}</p>
            </div>
          </a>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-gray-900">Activités récentes</h3>
        </div>
        <div class="space-y-4" *ngIf="recentActivities.length > 0; else noActivities">
          <div *ngFor="let a of recentActivities" class="flex items-start gap-3">
            <div class="p-2 bg-indigo-50 rounded-full">
              <span class="material-symbols-outlined text-indigo-600 text-sm">notifications</span>
            </div>
            <div class="flex-1">
              <p class="text-sm font-medium text-gray-900">{{ a.action }}</p>
              <p class="text-xs text-gray-500">{{ a.detail }}</p>
            </div>
            <span class="text-xs text-gray-400 whitespace-nowrap">{{ a.time }}</span>
          </div>
        </div>
        <ng-template #noActivities>
          <div class="text-sm text-gray-500 text-center py-8">Aucune activité récente</div>
        </ng-template>
      </div>
    </div>
  </ng-container>

  <ng-template #loadingState>
    <div class="flex flex-col items-center justify-center py-16">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
      <p class="text-sm text-gray-500">Chargement du tableau de bord...</p>
    </div>
  </ng-template>
</div>
