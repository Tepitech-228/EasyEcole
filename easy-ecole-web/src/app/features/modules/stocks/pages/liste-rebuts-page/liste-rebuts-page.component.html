<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-header-title
    title="Rebuts"
    subtitle="Gérez les articles mis au rebut">
  </app-header-title>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
    <div class="flex justify-end">
      <app-custom-button *ngIf="rolesValue.isInstitution || rolesValue.isAdmin || rolesValue.isCaissierBanque" (click)="ouvrirFormulaire()" text="Nouveau rebut" color="primary"></app-custom-button>
    </div>
  </div>

  <div *ngIf="showForm" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Nouveau rebut</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Article *</label>
        <select [(ngModel)]="formData.articleId" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500">
          <option value="">Sélectionner</option>
          <option *ngFor="let a of articles" [value]="a.id">{{ a.nom }} ({{ a.reference }})</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Quantité *</label>
        <input [(ngModel)]="formData.quantite" type="number" min="1" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Motif</label>
        <input [(ngModel)]="formData.motif" type="text" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500" placeholder="Motif du rebut" />
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-4">
      <app-custom-button (click)="fermerFormulaire()" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
      <app-custom-button (click)="creerRebut()" text="Créer" color="primary"></app-custom-button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-100">
        <thead>
          <tr class="bg-gray-50/50">
            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Article</th>
            <th class="px-5 py-3.5 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Quantité</th>
            <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Motif</th>
            <th class="px-5 py-3.5 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Date déclaration</th>
            <th class="px-5 py-3.5 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
          <tr *ngFor="let r of rebuts; trackBy: trackByFn" class="hover:bg-gray-50/50 transition-colors">
            <td class="px-5 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ r.article?.nom || '-' }}</td>
            <td class="px-5 py-4 whitespace-nowrap text-center text-sm text-gray-700">{{ r.quantite }}</td>
            <td class="px-5 py-4 whitespace-nowrap text-sm text-gray-500 max-w-[300px] truncate">{{ r.motif || '-' }}</td>
            <td class="px-5 py-4 whitespace-nowrap text-center text-sm text-gray-700">{{ r.dateDeclaration ? (r.dateDeclaration | date:'dd/MM/yyyy') : (r.createdAt | date:'dd/MM/yyyy') }}</td>
            <td class="px-5 py-4 whitespace-nowrap text-right">
              <div class="flex items-center justify-end gap-2">
                <app-custom-button *ngIf="rolesValue.isInstitution || rolesValue.isAdmin || rolesValue.isCaissierBanque" (click)="supprimer(r.id)" text="Supprimer" color="primary" [outlined]="true"></app-custom-button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>
    <div *ngIf="!loading && rebuts.length === 0" class="px-5 py-12 text-center">
      <svg class="mx-auto h-12 w-12 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      <p class="mt-4 text-sm text-gray-500">Aucun rebut enregistré</p>
    </div>
  </div>
</div>
