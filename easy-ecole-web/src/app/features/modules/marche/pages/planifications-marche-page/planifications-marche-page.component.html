<app-header-title title="Planifications des marchés" subtitle="Programmation prévisionnelle des marchés"></app-header-title>

<div class="flex justify-end mb-4">
  <app-custom-button text="Nouvelle planification" (click)="ouvrirFormulaire()"></app-custom-button>
</div>

<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<div *ngIf="!loading && items.length === 0" class="text-center py-8 text-gray-400">Aucune planification</div>

<div class="overflow-x-auto" *ngIf="!loading && filtered.length > 0">
  <table class="w-full text-sm">
    <thead><tr class="text-left border-b"><th>Libellé</th><th>Période</th><th>Description</th><th>Statut</th><th>Actions</th></tr></thead>
    <tbody>
      <tr *ngFor="let item of filtered" class="border-b hover:bg-gray-50">
        <td class="py-2 font-medium">{{ item.libelle }}</td>
        <td>{{ item.dateDebut | date:'shortDate' }} → {{ item.dateFin | date:'shortDate' }}</td>
        <td class="text-gray-500 text-xs max-w-xs truncate">{{ item.description }}</td>
        <td><span class="px-2 py-1 rounded text-xs" [class]="getStatutColor(item.statut)">{{ getStatutLabel(item.statut) }}</span></td>
        <td class="flex gap-1">
          <button (click)="ouvrirFormulaire(item)" class="text-blue-500 hover:text-blue-700 text-xs">✎</button>
          <button (click)="supprimer(item.id)" class="text-red-500 hover:text-red-700 text-xs">🗑</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-custom-modal [showModal]="showForm" (onCloseModal)="fermerFormulaire()">
  <h3 class="text-lg font-semibold mb-4">{{ editingId ? 'Modifier' : 'Nouvelle' }} planification</h3>
  <div class="grid gap-3">
    <input [(ngModel)]="formData.libelle" placeholder="Libellé" class="form-input">
    <div class="flex gap-3">
      <div class="flex-1"><label class="text-xs text-gray-500">Début</label><input type="date" [(ngModel)]="formData.dateDebut" class="form-input"></div>
      <div class="flex-1"><label class="text-xs text-gray-500">Fin</label><input type="date" [(ngModel)]="formData.dateFin" class="form-input"></div>
    </div>
    <textarea [(ngModel)]="formData.description" placeholder="Description" class="form-input" rows="3"></textarea>
    <select [(ngModel)]="formData.statut" class="form-input">
      <option value="planifie">Planifié</option><option value="en_cours">En cours</option>
      <option value="termine">Terminé</option><option value="annule">Annulé</option>
    </select>
    <div class="flex gap-2 justify-end mt-2">
      <app-custom-button text="Annuler" [outlined]="true" (click)="fermerFormulaire()"></app-custom-button>
      <app-custom-button text="Enregistrer" (click)="sauvegarder()"></app-custom-button>
    </div>
  </div>
</app-custom-modal>
