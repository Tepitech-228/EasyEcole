<div class="p-6 space-y-6">
  <div class="border border-slate-200 bg-gradient-to-r from-primary-950 via-primary-900 to-primary p-6 text-white shadow-sm">
    <div>
      <p class="text-sm uppercase tracking-[0.3em] text-white/60">Publication institutionnelle</p>
      <h2 class="mt-2 text-2xl font-semibold">Nouvelle annonce</h2>
      <p class="mt-2 max-w-2xl text-sm text-white/60">Rédigez une information claire destinée à toute la communauté académique.</p>
    </div>
  </div>

  <div class="max-w-3xl form-card">
    <div *ngIf="submitted" class="mb-4 flex items-center gap-2 rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">
      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      L'annonce a été publiée avec succès.
    </div>
    <div *ngIf="error" class="mb-4 flex items-center gap-2 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">
      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Veuillez remplir tous les champs.
    </div>

    <div class="space-y-5">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Titre</label>
        <input [(ngModel)]="nouvelleAnnonce.titre" placeholder="Ex: Rentrée académique 2026" class="form-input">
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Destiné à</label>
        <select [(ngModel)]="nouvelleAnnonce.cible" class="form-input">
          <option *ngFor="let c of cibles" [value]="c.value">{{ c.label }}</option>
        </select>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-slate-700">Contenu</label>
        <textarea [(ngModel)]="nouvelleAnnonce.contenu" rows="6" placeholder="Détaillez votre annonce..." class="form-input"></textarea>
      </div>
      <div class="flex flex-wrap items-center gap-3 pt-2">
        <button (click)="creerAnnonce()" [disabled]="submitting" class="submit-btn">
          <span *ngIf="submitting" class="inline-flex items-center gap-2">
            <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
            Publication en cours...
          </span>
          <span *ngIf="!submitting">Publier</span>
        </button>
        <app-custom-button text="Annuler" link="/communication/annonces" color="gray"></app-custom-button>
      </div>
    </div>
  </div>
</div>
