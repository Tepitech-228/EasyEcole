<div class="flex items-start justify-between">
  <app-header-title title="Bulletins de notes" subtitle="Gérez et consultez les bulletins des étudiants"></app-header-title>
  <a *ngIf="rolesValue.isInstitution || rolesValue.isAdmin" routerLink="/bulletins/generer"
     class="inline-flex items-center px-4 py-2.5 bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold rounded-xl transition-colors shadow-sm">
    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    Générer
  </a>
</div>

<div class="mt-6 flex flex-col gap-y-4">
  <!-- Cascading filters -->
  <app-filters-annee-niveau-parcours
    [annees]="annees"
    [niveaux]="niveaux"
    [parcoursList]="parcoursList"
    [sessions]="sessions"
    [loading]="!dataLoaded"
    [showResultCount]="true"
    [resultCount]="totalItems"
    [resultLabel]="'bulletin(s)'"
    (filterChange)="onFilterChange($event)">
  </app-filters-annee-niveau-parcours>

  <!-- Extra filters -->
  <div class="bg-white border border-gray-200 rounded-lg p-3 flex items-center gap-4">
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Semestre</label>
      <select [(ngModel)]="semestre" (change)="charger()" class="form-select-sm">
        <option value="">Tous</option>
        <option value="semestre1">Semestre 1</option>
        <option value="semestre2">Semestre 2</option>
        <option value="semestre3">Semestre 3</option>
        <option value="semestre4">Semestre 4</option>
        <option value="semestre5">Semestre 5</option>
        <option value="semestre6">Semestre 6</option>
      </select>
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Statut</label>
      <select [(ngModel)]="statut" (change)="charger()" class="form-select-sm">
        <option value="">Tous</option>
        <option value="brouillon">Brouillon</option>
        <option value="publie">Publié</option>
      </select>
    </div>
  </div>

  <!-- Dossier tree view -->
  <app-dossier-view
    [nodes]="treeNodes"
    [columns]="itemColumns"
    [batchActions]="batchActions"
    [loading]="loading"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [renderItemActions]="true"
    (pageChange)="onPageChange($event)"
    (itemAction)="onItemAction($event)">
  </app-dossier-view>
</div>
