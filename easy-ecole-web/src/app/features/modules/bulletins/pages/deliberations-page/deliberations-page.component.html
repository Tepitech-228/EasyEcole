<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-header-title
    title="Délibérations"
    subtitle="Gérez les sessions de délibération et les résultats par classe">
  </app-header-title>

  <div class="mt-8 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
    <div class="bg-white rounded-2xl border border-gray-100 p-5 shadow-sm">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total</p>
      <p class="mt-1 text-2xl font-bold text-gray-900">{{ totalItems }}</p>
    </div>
    <div class="bg-white rounded-2xl border border-amber-100 p-5 shadow-sm">
      <p class="text-xs font-medium text-amber-600 uppercase tracking-wider">Planifiées</p>
      <p class="mt-1 text-2xl font-bold text-amber-700">{{ nbPlanifiees }}</p>
    </div>
    <div class="bg-white rounded-2xl border border-blue-100 p-5 shadow-sm">
      <p class="text-xs font-medium text-blue-600 uppercase tracking-wider">En cours</p>
      <p class="mt-1 text-2xl font-bold text-blue-700">{{ nbEnCours }}</p>
    </div>
    <div class="bg-white rounded-2xl border border-green-100 p-5 shadow-sm">
      <p class="text-xs font-medium text-green-600 uppercase tracking-wider">Clôturées</p>
      <p class="mt-1 text-2xl font-bold text-green-700">{{ nbCloturees }}</p>
    </div>
    <div class="bg-white rounded-2xl border border-purple-100 p-5 shadow-sm">
      <p class="text-xs font-medium text-purple-600 uppercase tracking-wider">Publiées</p>
      <p class="mt-1 text-2xl font-bold text-purple-700">{{ nbPubliees }}</p>
    </div>
    <div class="bg-white rounded-2xl border border-red-100 p-5 shadow-sm">
      <p class="text-xs font-medium text-red-600 uppercase tracking-wider">Contestées</p>
      <p class="mt-1 text-2xl font-bold text-red-700">{{ nbContestees }}</p>
    </div>
  </div>

  <app-filters-annee-niveau-parcours
    [annees]="annees"
    [niveaux]="niveaux"
    [parcoursList]="parcoursList"
    [sessions]="sessions"
    [loading]="!dataLoaded"
    [showResultCount]="true"
    [resultCount]="totalItems"
    [resultLabel]="'délibération(s)'"
    (filterChange)="onFilterChange($event)">
  </app-filters-annee-niveau-parcours>

  <div class="bg-white border border-gray-200 rounded-lg p-3 mb-4 flex items-center gap-4 flex-wrap">
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Période</label>
      <select [(ngModel)]="filterPeriode" (change)="charger()" class="text-sm border border-gray-200 rounded-lg px-3 py-2 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        <option value="">Toutes périodes</option>
        <option value="semestre1">Semestre 1</option>
        <option value="semestre2">Semestre 2</option>
        <option value="semestre3">Semestre 3</option>
        <option value="semestre4">Semestre 4</option>
        <option value="semestre5">Semestre 5</option>
        <option value="semestre6">Semestre 6</option>
      </select>
    </div>
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-gray-500">Statut</label>
      <select [(ngModel)]="filterStatut" (change)="charger()" class="text-sm border border-gray-200 rounded-lg px-3 py-2 bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        <option value="">Tous statuts</option>
        <option value="planifiee">Planifiée</option>
        <option value="en_cours">En cours</option>
        <option value="cloturee">Clôturée</option>
        <option value="publiee">Publiée</option>
        <option value="contestee">Contestée</option>
      </select>
    </div>
    <button (click)="resetFiltres()" class="text-sm px-3 py-2 text-gray-500 hover:text-gray-700 bg-gray-50 hover:bg-gray-100 rounded-lg transition-colors border border-gray-200">
      Réinitialiser
    </button>
    <button *ngIf="rolesValue.isInstitution || rolesValue.isAdmin" (click)="ouvrirFormulaire()" class="ml-auto inline-flex items-center px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-colors shadow-sm">
      <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Planifier
    </button>
  </div>

  <div *ngIf="showForm" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">Nouvelle délibération</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Libellé</label>
        <input [(ngModel)]="formData.libelle" type="text" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" placeholder="Ex: Délibération S1 - 6ème A" />
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Classe</label>
        <select [(ngModel)]="formData.classeId" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
          <option value="">Sélectionner</option>
          <option *ngFor="let c of classes" [value]="c.id">{{ c.libelle }}</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Année scolaire</label>
        <select [(ngModel)]="formData.anneeAcademiqueId" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
          <option value="">Sélectionner</option>
          <option *ngFor="let a of annees" [value]="a.id">{{ a.libelle }}</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Période</label>
        <select [(ngModel)]="formData.periode" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
          <option value="semestre1">Semestre 1</option>
          <option value="semestre2">Semestre 2</option>
          <option value="semestre3">Semestre 3</option>
          <option value="semestre4">Semestre 4</option>
          <option value="semestre5">Semestre 5</option>
          <option value="semestre6">Semestre 6</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Session</label>
        <select [(ngModel)]="formData.sessionType" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
          <option value="initiale">Initiale</option>
          <option value="rattrapage">Rattrapage</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Date</label>
        <input [(ngModel)]="formData.date" type="date" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" />
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-4">
      <button (click)="fermerFormulaire()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Annuler</button>
      <button (click)="creerDeliberation()" class="px-4 py-2 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">Créer</button>
    </div>
  </div>

  <app-batch-toolbar
    *ngIf="selectedIds.length > 0"
    [selectedCount]="selectedIds.length"
    [actions]="batchActions"
    [loading]="batchLoading"
    (action)="onBatchAction({ action: $event, ids: selectedIds })"
    (deselectAll)="selectedIds = []">
  </app-batch-toolbar>

  <app-dossier-view
    [nodes]="treeNodes"
    [columns]="itemColumns"
    [batchActions]="batchActions"
    [loading]="loading"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    [pageSize]="pageSize"
    [renderItemActions]="true"
    (selectionChange)="onSelectionChange($event)"
    (batchAction)="onBatchAction($event)"
    (pageChange)="onPageChange($event)"
    (itemAction)="onItemAction($event)">
  </app-dossier-view>
</div>
