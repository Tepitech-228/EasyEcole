<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-header-title title="Templates de documents" subtitle="Modèles HTML utilisés pour la génération des documents"></app-header-title>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
    <div class="flex justify-between items-center flex-wrap gap-3">
      <div class="flex gap-3">
        <select [(ngModel)]="selectedTypeId" (change)="getTemplates()" class="block rounded-md border-0 py-1.5 text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 text-sm">
          <option value="">Tous les types</option>
          <option *ngFor="let t of types" [value]="t.id">{{ t.code }} — {{ t.libelle }}</option>
        </select>
      </div>
      <div class="flex gap-2">
        <select #newType class="block rounded-md border-0 py-1.5 text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 text-sm">
          <option value="">Choisir un type...</option>
          <option *ngFor="let t of types" [value]="t.id">{{ t.code }} — {{ t.libelle }}</option>
        </select>
        <app-custom-button (click)="creer(newType.value)" text="Nouveau template" color="indigo"></app-custom-button>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <div *ngFor="let tmpl of templates" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 hover:shadow-md transition-shadow">
      <div class="flex items-start justify-between mb-3">
        <div>
          <h3 class="text-sm font-semibold text-gray-900">{{ tmpl.libelle }}</h3>
          <p class="text-xs text-gray-500 mt-0.5">{{ tmpl.type?.code }} — v{{ tmpl.version }}</p>
        </div>
        <span *ngIf="tmpl.isDefault" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700">Défaut</span>
      </div>
      <div class="flex gap-2 mt-4">
        <app-custom-button (click)="editer(tmpl.id)" text="Éditer" color="blue" [outlined]="true"></app-custom-button>
        <app-custom-button (click)="supprimer(tmpl.id)" text="Supprimer" color="indigo" [outlined]="true"></app-custom-button>
      </div>
    </div>
  </div>

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>
  <div *ngIf="!loading && templates.length === 0" class="text-center py-12 text-sm text-gray-500">Aucun template trouvé</div>
</div>
