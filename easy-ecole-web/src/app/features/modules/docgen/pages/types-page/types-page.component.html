<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-header-title title="Catalogue des documents" subtitle="Types de documents disponibles dans l'établissement"></app-header-title>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 mb-6">
    <div class="flex justify-between items-center flex-wrap gap-3">
      <div class="flex gap-3">
        <select [(ngModel)]="selectedCategorie" (change)="filtrer()" class="block rounded-md border-0 py-1.5 text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 text-sm">
          <option value="">Toutes les catégories</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
        <input [(ngModel)]="search" (input)="filtrer()" type="text" placeholder="Rechercher..." class="block rounded-md border-0 py-1.5 text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-indigo-600 text-sm pl-3" />
      </div>
      <app-custom-button *ngIf="rolesValue.isAdmin" (click)="ouvrirFormulaire()" text="Nouveau type" color="indigo"></app-custom-button>
    </div>
  </div>

  <div *ngIf="showForm" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 mb-6">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">{{ editingId ? 'Modifier' : 'Nouveau' }} type de document</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div><label class="block text-xs font-medium text-gray-500 mb-1">Code *</label><input [(ngModel)]="formData.code" type="text" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500/20 focus:border-red-500" /></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">Libellé *</label><input [(ngModel)]="formData.libelle" type="text" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500/20 focus:border-red-500" /></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">Catégorie</label><input [(ngModel)]="formData.categorie" type="text" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500/20 focus:border-red-500" /></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">Module source</label><input [(ngModel)]="formData.moduleSource" type="text" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500/20 focus:border-red-500" /></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">DUA</label><input [(ngModel)]="formData.dua" type="text" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500/20 focus:border-red-500" placeholder="Permanente, 5 ans..." /></div>
      <div><label class="block text-xs font-medium text-gray-500 mb-1">Format</label><select [(ngModel)]="formData.format" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-red-500/20 focus:border-red-500"><option value="PDF">PDF</option><option value="DOCX">DOCX</option></select></div>
      <div class="flex items-center gap-4">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" [(ngModel)]="formData.signatureRequired" /> Signature requise</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" [(ngModel)]="formData.autoGenerated" /> Généré automatiquement</label>
      </div>
    </div>
    <div class="flex justify-end gap-3 mt-4">
      <app-custom-button (click)="fermerFormulaire()" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
      <app-custom-button (click)="sauvegarder()" [text]="editingId ? 'Modifier' : 'Créer'" color="indigo"></app-custom-button>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-100">
        <thead><tr class="bg-gray-50/50">
          <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase">Code</th>
          <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase">Libellé</th>
          <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase">Catégorie</th>
          <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase">Module</th>
          <th class="px-5 py-3.5 text-center text-xs font-semibold text-gray-500 uppercase">Signature</th>
          <th class="px-5 py-3.5 text-center text-xs font-semibold text-gray-500 uppercase">Auto</th>
          <th class="px-5 py-3.5 text-left text-xs font-semibold text-gray-500 uppercase">DUA</th>
          <th class="px-5 py-3.5 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
        </tr></thead>
        <tbody class="divide-y divide-gray-50">
          <tr *ngFor="let t of filteredTypes" class="hover:bg-gray-50/50 transition-colors">
            <td class="px-5 py-4 whitespace-nowrap text-sm font-mono font-medium text-gray-900">{{ t.code }}</td>
            <td class="px-5 py-4 text-sm text-gray-900">{{ t.libelle }}</td>
            <td class="px-5 py-4"><span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" [class]="'bg-' + getBadgeColor(t.categorie) + '-50 text-' + getBadgeColor(t.categorie) + '-700'">{{ t.categorie }}</span></td>
            <td class="px-5 py-4 text-sm text-gray-500">{{ t.moduleSource }}</td>
            <td class="px-5 py-4 text-center"><span *ngIf="t.signatureRequired" class="text-green-600">✓</span><span *ngIf="!t.signatureRequired" class="text-gray-300">—</span></td>
            <td class="px-5 py-4 text-center"><span *ngIf="t.autoGenerated" class="text-blue-600">✓</span><span *ngIf="!t.autoGenerated" class="text-gray-300">—</span></td>
            <td class="px-5 py-4 text-sm text-gray-500">{{ t.dua || '—' }}</td>
            <td class="px-5 py-4 text-right">
              <div class="flex justify-end gap-2">
                <app-custom-button (click)="ouvrirFormulaire(t)" text="Modifier" color="blue" [outlined]="true"></app-custom-button>
                <app-custom-button *ngIf="rolesValue.isAdmin" (click)="supprimer(t.id)" text="Supprimer" color="indigo" [outlined]="true"></app-custom-button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <app-loading-spinner *ngIf="loading"></app-loading-spinner>
    <div *ngIf="!loading && filteredTypes.length === 0" class="px-5 py-12 text-center text-sm text-gray-500">Aucun type de document trouvé</div>
  </div>
</div>
