<div class="dashboard-surface compta-workspace min-h-screen p-4 sm:p-6 lg:p-8">
  <div class="compta-workspace-hero">
    <div>
      <p class="dashboard-kicker"><span class="material-symbols-outlined">account_balance</span> ESA-COMPTA</p>
      <app-header-title title="Vérification des bordereaux" subtitle="Cabinet comptable — Contrôle et validation des paiements"></app-header-title>
    </div>
    <div class="compta-workspace-status"><span></span> Service actif</div>
  </div>

  <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ apiErrorMessage }}
  </div>

  <div *ngIf="loading" class="flex items-center justify-center py-12">
    <span class="material-symbols-outlined animate-spin text-3xl text-indigo-500">progress_activity</span>
    <span class="ml-2 text-gray-500">Chargement...</span>
  </div>

  <div *ngIf="!loading && !error">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
      <div class="dashboard-surface-card p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-gray-500 uppercase font-semibold">Bordereaux reçus</p>
            <p class="text-2xl font-bold text-gray-800 mt-1">{{ total }}</p>
            <p class="text-xs text-gray-400 mt-1">Ce mois</p>
          </div>
          <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
            <span class="material-symbols-outlined text-blue-600">receipt_long</span>
          </div>
        </div>
      </div>

      <div class="dashboard-surface-card p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-gray-500 uppercase font-semibold">Authentifiés</p>
            <p class="text-2xl font-bold text-green-600 mt-1">{{ valides }}</p>
            <p class="text-xs text-gray-400 mt-1">Ce mois</p>
          </div>
          <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
            <span class="material-symbols-outlined text-green-600">check_circle</span>
          </div>
        </div>
      </div>

      <div class="dashboard-surface-card p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs text-gray-500 uppercase font-semibold">Rejetés</p>
            <p class="text-2xl font-bold text-red-600 mt-1">{{ rejetes }}</p>
            <p class="text-xs text-gray-400 mt-1">Ce mois</p>
          </div>
          <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center">
            <span class="material-symbols-outlined text-red-600">cancel</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
