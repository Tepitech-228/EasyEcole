<div class="flex justify-between items-start mb-8">
  <app-header-title title="Processus GED" subtitle="Gérer les processus documentaires"></app-header-title>
  <button (click)="newProcessus()"
    class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-md hover:bg-indigo-700 flex items-center gap-x-2">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Nouveau processus
  </button>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <div *ngIf="loading" class="py-16 text-center text-sm text-gray-400">Chargement...</div>
  <div *ngIf="!loading && processus.length === 0" class="py-16 text-center">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#d7d9e6" stroke-width="1.5" class="mx-auto mb-3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <p class="text-sm text-gray-400">Aucun processus trouvé</p>
  </div>
  <table class="w-full border-collapse" *ngIf="!loading && processus.length > 0">
    <thead>
      <tr class="text-left text-xs font-semibold text-gray-400 uppercase tracking-wide bg-gray-50 border-b border-gray-200">
        <th class="py-3.5 px-4">Code</th>
        <th class="py-3.5 px-4">Libellé</th>
        <th class="py-3.5 px-4">Module source</th>
        <th class="py-3.5 px-4">Actif</th>
        <th class="py-3.5 px-4 text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of processus"
        class="text-sm text-gray-700 border-b border-gray-100 hover:bg-gray-50 transition-colors">
        <td class="py-3 px-4 font-mono text-xs font-semibold text-indigo-600">{{ p.code }}</td>
        <td class="py-3 px-4 font-medium text-gray-900">{{ p.libelle }}</td>
        <td class="py-3 px-4 text-gray-500">{{ p.moduleSource || '-' }}</td>
        <td class="py-3 px-4">
          <button (click)="toggleActif(p)" [disabled]="togglingId === p.id"
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none"
            [class.bg-indigo-600]="p.actif"
            [class.bg-gray-200]="!p.actif">
            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform ml-1"
              [class.translate-x-5]="p.actif"></span>
          </button>
        </td>
        <td class="py-3 px-4 text-right">
          <button (click)="editProcessus(p.id)"
            class="px-3 py-1.5 border border-gray-200 rounded-lg text-xs font-medium text-gray-600 hover:bg-gray-50 transition-colors">
            Modifier
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
