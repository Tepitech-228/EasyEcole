<div class="max-w-2xl mx-auto">
  <div class="flex justify-between items-start mb-8">
    <app-header-title [title]="isEdit ? 'Modifier le processus' : 'Nouveau processus'"
      [subtitle]="isEdit ? 'Modifier les informations du processus' : 'Créer un nouveau processus documentaire'">
    </app-header-title>
  </div>

  <div *ngIf="loading" class="text-center py-16 text-gray-400">Chargement...</div>

  <div *ngIf="!loading" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Code <span class="text-red-500">*</span></label>
        <input type="text" formControlName="code" (input)="onCodeInput()" placeholder="Ex: VALIDATION_INSCRIPTION"
          class="block w-full rounded-md border-0 py-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm">
        <div *ngIf="form.get('code')?.touched && form.get('code')?.invalid" class="text-xs text-red-500 mt-1">
          Le code est obligatoire
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Libellé <span class="text-red-500">*</span></label>
        <input type="text" formControlName="libelle" placeholder="Ex: Validation des inscriptions"
          class="block w-full rounded-md border-0 py-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm">
        <div *ngIf="form.get('libelle')?.touched && form.get('libelle')?.invalid" class="text-xs text-red-500 mt-1">
          Le libellé est obligatoire
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea formControlName="description" rows="3" placeholder="Description du processus..."
          class="block w-full rounded-md border-0 py-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Module source</label>
        <input type="text" formControlName="moduleSource" placeholder="Ex: SCOLARITE, FINANCE"
          class="block w-full rounded-md border-0 py-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm">
      </div>

      <div class="flex items-center gap-x-3">
        <input type="checkbox" formControlName="actif" id="actif"
          class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-600">
        <label for="actif" class="text-sm font-medium text-gray-700">Actif</label>
      </div>

      <div class="flex justify-end gap-x-3 pt-4 border-t border-gray-200">
        <button type="button" (click)="cancel()"
          class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 font-medium">
          Annuler
        </button>
        <button type="submit" [disabled]="saving"
          class="px-6 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-md hover:bg-indigo-700 disabled:opacity-50">
          {{ saving ? 'Enregistrement...' : (isEdit ? 'Modifier' : 'Créer') }}
        </button>
      </div>
    </form>
  </div>
</div>
