<div class="sessions-page">
  <div class="page-head">
    <div>
      <h2>Sessions</h2>
      <p>Regroupez des documents par session d'archivage avec champs personnalisés</p>
    </div>
    <button class="btn-primary" (click)="toggleCreate()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      {{ creating ? 'Annuler' : 'Nouvelle session' }}
    </button>
  </div>

  <div class="create-card" *ngIf="creating">
    <form [formGroup]="sessionForm" (ngSubmit)="createSession()">
      <div class="form-grid">
        <div class="form-field">
          <label>Titre</label>
          <input type="text" formControlName="title" placeholder="Titre de la session" />
        </div>
        <div class="form-field">
          <label>Champs personnalisés</label>
          <input type="text" formControlName="fields" placeholder="provenance, type, numero, service..." />
        </div>
        <div class="form-field full">
          <label>Description</label>
          <textarea formControlName="description" rows="2" placeholder="Description de la session"></textarea>
        </div>
        <div class="form-field full">
          <label>Contributeurs (IDs séparés par des virgules)</label>
          <input type="text" formControlName="participantIds" placeholder="12, 23, 45" />
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-outline" (click)="toggleCreate()">Annuler</button>
        <button type="submit" class="btn-primary">Créer la session</button>
      </div>
    </form>
  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Chargement des sessions...</p>
  </div>

  <div class="empty-state" *ngIf="!loading && sessions.length === 0">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#d7d9e6" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
    <p>Aucune session pour le moment</p>
  </div>

  <div class="sessions-grid" *ngIf="!loading && sessions.length > 0">
    <div class="session-card" *ngFor="let s of sessions" (click)="goToSession(s.id)">
      <div class="session-icon">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#3b5bff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      </div>
      <div class="session-body">
        <h3>{{ s.nom }}</h3>
        <p>{{ s.description || 'Aucune description' }}</p>
        <div class="session-meta">
          <span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            {{ s.documents?.length || 0 }} doc(s)
          </span>
          <span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            {{ s.participantIds?.length || 0 }} contributeur(s)
          </span>
        </div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa4c2" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>
</div>
