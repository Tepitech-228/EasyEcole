<app-return-back link="/rh/evaluations" text="Retour aux évaluations"></app-return-back>

<div class="flex justify-between items-start gap-x-8 mb-8">
  <app-header-title [title]="isEdit ? 'Modifier l\'évaluation' : 'Nouvelle évaluation'" subtitle="Créer une évaluation et définir les critères associés"></app-header-title>
</div>

<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
  <div class="evaluation-card bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
      <div class="rounded-lg border border-gray-200 p-5 bg-gray-50/70">
        <h3 class="text-base font-semibold text-gray-900">Informations générales</h3>
        <div class="mt-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Employé</label>
            <select formControlName="employeId" class="block w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
              <option value="" disabled>Sélectionner un employé</option>
              <option *ngFor="let emp of employes" [value]="emp.id">{{ employeLabel(emp) }}</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Évaluateur</label>
            <input type="text" formControlName="evaluateurId" placeholder="Nom de l'évaluateur" class="block w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Date d'évaluation</label>
            <input type="date" formControlName="dateEvaluation" class="block w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
          </div>
        </div>
      </div>

      <div class="rounded-lg border border-gray-200 p-5 bg-gray-50/70">
        <h3 class="text-base font-semibold text-gray-900">Commentaire</h3>
        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Commentaire</label>
          <textarea rows="4" formControlName="commentaire" placeholder="Ajouter un commentaire..." class="block w-full rounded-md border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></textarea>
        </div>
      </div>
    </div>

    <div class="rounded-lg border border-gray-200 p-5 bg-gray-50/70">
      <h3 class="text-base font-semibold text-gray-900 mb-2">Critères et notes</h3>
      <p class="text-sm text-gray-500 mb-4">Attribuez une note sur 20 pour chaque critère.</p>
      <div formArrayName="notes" class="space-y-4">
        <div *ngFor="let c of criteres; let i = index" class="flex items-center gap-4 rounded-lg border border-gray-200 bg-white p-4">
          <div class="flex-1">
            <p class="text-sm font-medium text-gray-900">{{ c.nom || 'Critère' }}</p>
            <p class="text-xs text-gray-500">{{ c.description || 'Aucune description' }}</p>
          </div>
          <div class="w-32">
            <label class="block text-xs font-medium text-gray-500 mb-1">Note /20</label>
            <input type="number" min="0" max="20" step="0.5" formControlName="note" class="block w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">
          </div>
        </div>
        <p *ngIf="criteres.length === 0" class="text-sm text-gray-500">
          Aucun critère d'évaluation disponible. Ajoutez des critères dans la configuration RH.
        </p>
      </div>
    </div>

    <div class="mt-8 flex flex-wrap justify-end gap-3 border-t border-gray-200 pt-6">
      <a routerLink="/rh/evaluations" class="px-4 py-1.5 text-sm font-medium rounded text-gray-600 ring-1 ring-inset ring-gray-300 hover:bg-gray-50">Annuler</a>
      <app-custom-button text="Enregistrer" [disabled]="form.invalid || saving"></app-custom-button>
    </div>
  </div>
</form>
