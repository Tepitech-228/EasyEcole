<app-header-title title="Paie"></app-header-title>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
  <div class="lg:col-span-2">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h3 class="text-lg font-semibold text-gray-900">Périodes de paie</h3>
        <div class="flex gap-2">
          <button (click)="openCreate()" class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors">
            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Nouvelle période
          </button>
          <a routerLink="/rh/parametres-paie" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium px-3 py-1.5">Paramètres</a>
        </div>
      </div>
      <app-loading-spinner *ngIf="loading"></app-loading-spinner>
      <table *ngIf="!loading" class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Période</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Dates</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Bulletins</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Statut</th>
            <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let p of periodes" class="hover:bg-gray-50">
            <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ p.mois }} {{ p.annee }}</td>
            <td class="px-6 py-4 text-sm text-gray-700">{{ p.dateDebut | date:'dd/MM/yyyy' }} - {{ p.dateFin | date:'dd/MM/yyyy' }}</td>
            <td class="px-6 py-4 text-sm text-gray-700">{{ p.bulletins }}</td>
            <td class="px-6 py-4">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="getStatutBadge(p.statut)">{{ p.statut }}</span>
            </td>
            <td class="px-6 py-4 text-right text-sm">
              <button (click)="openEdit(p)" class="text-indigo-600 hover:text-indigo-900 font-medium mr-3">Modifier</button>
              <button (click)="genererBulletins(p.id)" class="text-emerald-600 hover:text-emerald-900 font-medium mr-3">Générer</button>
              <button (click)="deleteItem(p.id)" class="text-red-600 hover:text-red-900 font-medium">Supprimer</button>
            </td>
          </tr>
          <tr *ngIf="periodes.length === 0">
            <td colspan="5" class="px-6 py-12 text-center text-sm text-gray-500">Aucune période trouvée</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div>
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h3 class="text-lg font-semibold text-gray-900 mb-4">Nouvelle période</h3>
      <p class="text-sm text-gray-500">Utilisez le bouton pour créer une période de paie.</p>
    </div>
  </div>
</div>

<app-custom-modal *ngIf="showModal" [title]="isEditing ? 'Modifier la période' : 'Nouvelle période'" subtitle="Saisissez les informations de la période" (onCloseModal)="closeModal()" [center]="true" [showModal]="showModal">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 gap-4 mb-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mois *</label>
          <select formControlName="mois" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <option value="">Sélectionner</option>
            <option *ngFor="let m of ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre']" [value]="m">{{m}}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Année *</label>
          <input type="number" formControlName="annee" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date début *</label>
          <input type="date" formControlName="dateDebut" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Date fin *</label>
          <input type="date" formControlName="dateFin" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Statut</label>
        <select formControlName="statut" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="ouverte">Ouverte</option>
          <option value="verrouillee">Verrouillée</option>
          <option value="cloturee">Clôturée</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <app-custom-button type="button" (click)="closeModal()" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
      <app-custom-button type="submit" [text]="isEditing ? 'Enregistrer' : 'Créer'" [disabled]="form.invalid"></app-custom-button>
    </div>
  </form>
</app-custom-modal>
