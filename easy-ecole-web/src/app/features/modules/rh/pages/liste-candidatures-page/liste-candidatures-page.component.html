<app-header-title
  title="Candidatures"
  subtitle="Consultez et gérez les candidatures reçues">
</app-header-title>

<div class="mb-6 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="relative">
      <input [(ngModel)]="searchTerm" type="text" placeholder="Rechercher un candidat ou un poste..." class="w-64 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm pl-10">
      <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
    <select [(ngModel)]="filterStatut" class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
      <option value="">Tous les statuts</option>
      <option value="soumise">Soumise</option>
      <option value="étudiée">Étudiée</option>
      <option value="retenue">Retenue</option>
      <option value="rejetée">Rejetée</option>
    </select>
  </div>
</div>

<div *ngIf="errorMessage" class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
  {{ errorMessage }}
</div>

<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<div *ngIf="!loading" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Candidat</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Offre</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Date</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Statut</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">CV</th>
        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let c of filteredCandidatures; trackBy: trackByFn" class="hover:bg-gray-50">
        <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ c.nom || '-' }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ getOffreTitre(c) }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ c.createdAt ? (c.createdAt | date:'dd/MM/yyyy') : '-' }}</td>
        <td class="px-6 py-4">
          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="getStatutBadge(c.statut || '')">{{ c.statut || '-' }}</span>
        </td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ c.cv ? 'Téléchargeable' : '-' }}</td>
        <td class="px-6 py-4 text-right text-sm">
          <div class="flex items-center justify-end gap-3">
            <select [value]="c.statut" (change)="changerStatut(c, $event.target.value)" class="text-xs border border-gray-200 rounded-lg px-2 py-1">
              <option value="soumise">Soumise</option>
              <option value="étudiée">Étudiée</option>
              <option value="retenue">Retenue</option>
              <option value="rejetée">Rejetée</option>
            </select>
            <button class="text-indigo-600 hover:text-indigo-900 font-medium" (click)="voirDetail(c.id)">Détails</button>
          </div>
        </td>
      </tr>
      <tr *ngIf="filteredCandidatures.length === 0">
        <td colspan="6" class="px-6 py-12 text-center text-sm text-gray-500">Aucune candidature trouvée</td>
      </tr>
    </tbody>
  </table>
</div>
