<app-return-back link="/rh/employes" text="Retour à la liste des employés"></app-return-back>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <div class="lg:col-span-1">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 text-center">
      <div class="w-24 h-24 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <span class="material-icons text-4xl text-indigo-600">person</span>
      </div>
      <h2 class="text-xl font-semibold text-gray-900">Empl. #{{ employeId }}</h2>
      <p class="text-sm text-gray-500 mt-1">Département IT</p>
      <span class="mt-3 inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">Actif</span>
    </div>
  </div>
  <div class="lg:col-span-2">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <h3 class="text-lg font-semibold text-gray-900 mb-4">Informations personnelles</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-xs font-medium text-gray-500 uppercase mb-1">Nom</label><p class="text-sm text-gray-900">Dupont</p></div>
        <div><label class="block text-xs font-medium text-gray-500 uppercase mb-1">Prénoms</label><p class="text-sm text-gray-900">Jean</p></div>
        <div><label class="block text-xs font-medium text-gray-500 uppercase mb-1">Matricule</label><p class="text-sm text-gray-900">EMP001</p></div>
        <div><label class="block text-xs font-medium text-gray-500 uppercase mb-1">Poste</label><p class="text-sm text-gray-900">Développeur</p></div>
        <div><label class="block text-xs font-medium text-gray-500 uppercase mb-1">Téléphone</label><p class="text-sm text-gray-900">+242 06 000 00 00</p></div>
        <div><label class="block text-xs font-medium text-gray-500 uppercase mb-1">Email</label><p class="text-sm text-gray-900">jean.dupont@ecole.cg</p></div>
      </div>
      <div class="mt-6 flex gap-3">
        <app-custom-button text="Modifier" color="primary"></app-custom-button>
        <app-custom-button text="Importer contrat" color="gray" [outlined]="true"></app-custom-button>
      </div>
    </div>
  </div>
</div>
