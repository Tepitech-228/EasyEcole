<div class="flex justify-between items-start gap-x-8 mb-8">
  <app-header-title title="Formations" subtitle="Gérer les formations RH et leurs participants"></app-header-title>
  <app-custom-button text="Nouvelle formation" (click)="openCreate()"></app-custom-button>
</div>

<div class="mb-6">
  <input type="text" placeholder="Rechercher une formation..." [(ngModel)]="searchTerm" class="w-64 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
</div>

<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<div *ngIf="!loading" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Titre</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Formateur</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Début</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Fin</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Type</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Participants</th>
        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let f of filteredFormations" class="hover:bg-gray-50">
        <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ f.titre || '-' }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ f.formateur || '-' }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ (f.dateDebut | date:'dd/MM/yyyy') || '-' }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ (f.dateFin | date:'dd/MM/yyyy') || '-' }}</td>
        <td class="px-6 py-4">
          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="getTypeBadge(f.type || '')">{{ f.type || '-' }}</span>
        </td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ participantCount(f) }}</td>
        <td class="px-6 py-4 text-right text-sm space-x-3">
          <a class="text-indigo-600 hover:text-indigo-900 font-medium" [routerLink]="['/rh/formations', f.id]">Détails</a>
          <button class="text-emerald-600 hover:text-emerald-900 font-medium" (click)="openEdit(f)">Modifier</button>
          <button class="text-red-600 hover:text-red-900 font-medium" (click)="deleteItem(f.id!)">Supprimer</button>
        </td>
      </tr>
      <tr *ngIf="filteredFormations.length === 0">
        <td colspan="7" class="px-6 py-14 text-center">
          <div class="flex flex-col items-center justify-center text-gray-500">
            <span class="material-symbols-outlined text-4xl text-gray-300 mb-2">school</span>
            <p class="text-sm font-medium">Aucune formation trouvée</p>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal création / édition -->
<app-custom-modal [showModal]="showModal" (onCloseModal)="closeModal()" [title]="isEditing ? 'Modifier la formation' : 'Nouvelle formation'">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Titre</label>
        <input type="text" formControlName="titre" class="block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
        <textarea rows="3" formControlName="description" placeholder="Description de la formation..." class="block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-indigo-500"></textarea>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Date début</label>
          <input type="date" formControlName="dateDebut" class="block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Date fin</label>
          <input type="date" formControlName="dateFin" class="block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Formateur</label>
          <input type="text" formControlName="formateur" class="block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Type</label>
          <select formControlName="type" class="block w-full rounded-md border border-gray-300 shadow-sm px-3 py-2.5 text-sm focus:border-indigo-500 focus:ring-indigo-500">
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
        </div>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-3">
      <button type="button" (click)="closeModal()" class="px-4 py-1.5 text-sm font-medium rounded text-gray-600 ring-1 ring-inset ring-gray-300 hover:bg-gray-50">Annuler</button>
      <app-custom-button text="Enregistrer" [disabled]="form.invalid"></app-custom-button>
    </div>
  </form>
</app-custom-modal>
