<app-header-title title="Formations"></app-header-title>

<div class="mb-6 flex items-center justify-between">
  <div class="relative">
    <input type="text" placeholder="Rechercher une formation..." class="w-64 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm pl-10">
    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
  </div>
  <button class="inline-flex items-center px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm">
    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    Nouvelle formation
  </button>
</div>

<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<div *ngIf="!loading" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Titre</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Formateur</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Début</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Fin</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Type</th>
        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let f of formations" class="hover:bg-gray-50">
        <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ f.titre }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ f.formateur }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ f.debut | date:'dd/MM/yyyy' }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ f.fin | date:'dd/MM/yyyy' }}</td>
        <td class="px-6 py-4">
          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="getTypeBadge(f.type)">{{ f.type }}</span>
        </td>
        <td class="px-6 py-4 text-right text-sm">
          <button class="text-indigo-600 hover:text-indigo-900 font-medium mr-3">Détails</button>
          <button class="text-emerald-600 hover:text-emerald-900 font-medium">Modifier</button>
        </td>
      </tr>
      <tr *ngIf="formations.length === 0">
        <td colspan="6" class="px-6 py-12 text-center text-sm text-gray-500">Aucune formation trouvée</td>
      </tr>
    </tbody>
  </table>
</div>
