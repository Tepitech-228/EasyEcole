<app-header-title title="Employés"></app-header-title>

<div class="mb-6 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <div class="relative">
      <input type="text" [(ngModel)]="searchTerm" placeholder="Rechercher un employé..." class="w-64 rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm pl-10">
      <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
    <select [(ngModel)]="filterDepartement" class="rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
      <option value="">Tous les départements</option>
      <option *ngFor="let d of distinctDepartements" [value]="d">{{d}}</option>
    </select>
  </div>
  <button (click)="openCreate()" class="inline-flex items-center px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm">
    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    Nouvel employé
  </button>
</div>

<app-loading-spinner *ngIf="loading"></app-loading-spinner>

<div *ngIf="!loading" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Matricule</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Nom & Prénoms</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Poste</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Département</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Statut</th>
        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let emp of filteredEmployes" class="hover:bg-gray-50">
        <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ emp.matricule }}</td>
        <td class="px-6 py-4 text-sm text-gray-900">{{ emp.nom }} {{ emp.prenoms }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ emp.poste?.titre || emp.poste || '-' }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ emp.departement?.nom || emp.departement || '-' }}</td>
        <td class="px-6 py-4">
          <span class="px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="getStatutBadge(emp.statut)">{{ emp.statut }}</span>
        </td>
        <td class="px-6 py-4 text-right text-sm">
          <a [routerLink]="['/rh/employes', emp.id]" class="text-indigo-600 hover:text-indigo-900 font-medium mr-3">Voir</a>
          <button (click)="openEdit(emp)" class="text-indigo-600 hover:text-indigo-900 font-medium mr-3">Modifier</button>
          <button (click)="deleteItem(emp.id)" class="text-red-600 hover:text-red-900 font-medium">Supprimer</button>
        </td>
      </tr>
      <tr *ngIf="employes.length === 0">
        <td colspan="6" class="px-6 py-12 text-center text-sm text-gray-500">Aucun employé trouvé</td>
      </tr>
    </tbody>
  </table>
</div>

<app-custom-modal *ngIf="showModal" [title]="isEditing ? 'Modifier l\'employé' : 'Nouvel employé'" subtitle="Saisissez les informations de l'employé" (onCloseModal)="closeModal()" [center]="true" [showModal]="showModal">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Matricule</label>
        <input type="text" formControlName="matricule" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
        <input type="text" formControlName="nom" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Prénoms</label>
        <input type="text" formControlName="prenoms" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Poste</label>
        <select formControlName="posteId" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option [ngValue]="null">Sélectionner</option>
          <option *ngFor="let p of postes" [ngValue]="p.id">{{ p.titre }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Département</label>
        <select formControlName="departementId" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option [ngValue]="null">Sélectionner</option>
          <option *ngFor="let d of departements" [ngValue]="d.id">{{ d.nom }}</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Statut</label>
        <select formControlName="statut" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option *ngFor="let s of ['actif','suspendu','quitté']" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <app-custom-button type="button" (click)="closeModal()" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
      <app-custom-button type="submit" [text]="isEditing ? 'Enregistrer' : 'Créer'" [disabled]="form.invalid"></app-custom-button>
    </div>
  </form>
</app-custom-modal>
