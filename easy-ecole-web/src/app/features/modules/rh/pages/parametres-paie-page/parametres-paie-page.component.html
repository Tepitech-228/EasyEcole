<app-header-title title="Paramètres de paie"></app-header-title>

<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <div class="px-6 py-5 border-b border-gray-200 flex items-center justify-between">
    <div>
      <h3 class="text-lg font-semibold text-gray-900">Rubriques de paie</h3>
      <p class="text-sm text-gray-500 mt-1">Configurez les rubriques de paie (SALAIRE_BASE, CNPS, IRPP, primes, etc.).</p>
    </div>
    <button (click)="openCreate()" class="inline-flex items-center px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      Nouvelle rubrique
    </button>
  </div>
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Code</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Libellé</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Type</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Mode calcul</th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Valeur</th>
        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr *ngFor="let r of rubriques" class="hover:bg-gray-50">
        <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ r.code }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ r.libelle }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ r.type }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ r.modeCalcul }}</td>
        <td class="px-6 py-4 text-sm text-gray-700">{{ r.valeur }}</td>
        <td class="px-6 py-4 text-right text-sm">
          <button (click)="openEdit(r)" class="text-indigo-600 hover:text-indigo-900 font-medium mr-3">Modifier</button>
          <button (click)="deleteItem(r.id)" class="text-red-600 hover:text-red-900 font-medium">Supprimer</button>
        </td>
      </tr>
      <tr *ngIf="rubriques.length === 0">
        <td colspan="6" class="px-6 py-12 text-center text-sm text-gray-500">Aucune rubrique configurée</td>
      </tr>
    </tbody>
  </table>
</div>

<app-custom-modal *ngIf="showModal" [title]="isEditing ? 'Modifier la rubrique' : 'Nouvelle rubrique'" subtitle="Saisissez les informations de la rubrique" (onCloseModal)="closeModal()" [center]="true" [showModal]="showModal">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="grid grid-cols-1 gap-4 mb-4">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Code *</label>
          <input formControlName="code" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="SALAIRE_BASE">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Libellé *</label>
          <input formControlName="libelle" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Salaire de base">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
          <select formControlName="type" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <option value="gain">Gain</option>
            <option value="retenue">Retenue</option>
            <option value="cotisation">Cotisation</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mode de calcul</label>
          <select formControlName="modeCalcul" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <option value="fixe">Fixe</option>
            <option value="pourcentage">Pourcentage</option>
            <option value="formule">Formule</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Valeur</label>
        <input type="number" step="0.01" formControlName="valeur" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" formControlName="imposable" id="imposable" class="rounded border-gray-300">
        <label for="imposable" class="text-sm text-gray-700">Imposable</label>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <app-custom-button type="button" (click)="closeModal()" text="Annuler" color="gray" [outlined]="true"></app-custom-button>
      <app-custom-button type="submit" [text]="isEditing ? 'Enregistrer' : 'Créer'" [disabled]="form.invalid"></app-custom-button>
    </div>
  </form>
</app-custom-modal>
