# =============================================================================
# EasyEcole — CI/CD Pipeline (GitHub Actions)
#
# Déclenchement :
#   - Pull Request vers main → validation complète (AUCUN déploiement)
#   - Push vers main → validation + build Docker + déploiement Dokploy
#
# Architecture :
#   Job 1: backend-validate   (install, typecheck, tests, build)
#   Job 2: frontend-validate  (install, build production)
#   Job 3: docker-build       (build images backend + frontend)
#   Job 4: deploy             (déploiement Dokploy + health check — push main uniquement)
#
# Secrets GitHub requis (voir README secrets en fin de fichier) :
#   - DOKPLOY_URL       : URL du serveur Dokploy (ex: https://dokploy.example.com)
#   - DOKPLOY_TOKEN     : Token API Dokploy
#   - DOKPLOY_APP_ID    : ID de l'application Dokploy
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Limiter les exécutions concurrentes pour la même branche
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — BACKEND VALIDATION
  # Installation, typecheck TypeScript, tests Jest, build Babel
  # ---------------------------------------------------------------------------
  backend-validate:
    name: '[CI] Backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-ecole-backend

    steps:
      - name: '[CI] Checkout'
        uses: actions/checkout@v4

      - name: '[CI] Setup Node.js ${{ env.NODE_VERSION }}'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: easy-ecole-backend/package-lock.json

      - name: '[CI] Installation des dépendances backend'
        run: npm ci

      - name: '[CI] Typecheck TypeScript'
        run: npx tsc --noEmit

      - name: '[CI] Tests backend (Jest)'
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-not-for-production' }}
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_NAME: easyecole_test
          DB_USER: root
          DB_PASS: ''
          CORS_ORIGIN: http://localhost:4200

      - name: '[CI] Build backend (Babel → lib/)'
        run: npm run build

      - name: '[CI] Upload build backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-lib
          path: easy-ecole-backend/lib/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # JOB 2 — FRONTEND VALIDATION
  # Installation, build production Angular
  # ---------------------------------------------------------------------------
  frontend-validate:
    name: '[CI] Frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-ecole-web

    steps:
      - name: '[CI] Checkout'
        uses: actions/checkout@v4

      - name: '[CI] Setup Node.js ${{ env.NODE_VERSION }}'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: easy-ecole-web/package-lock.json

      - name: '[CI] Installation des dépendances frontend'
        run: npm ci
        env:
          # Puppeteer tente de télécharger Chromium pendant npm ci — inutile ici
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: '[CI] Typecheck Angular'
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: '[CI] Build frontend production'
        run: ng build --configuration production
        env:
          NODE_OPTIONS: '--openssl-legacy-provider --max-old-space-size=3072'
          NG_CLI_ANALYTICS: 'false'

      - name: '[CI] Upload build frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: easy-ecole-web/dist/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # JOB 3 — DOCKER BUILD VALIDATION
  # Vérifie que les images Docker se construisent sans erreur
  # ---------------------------------------------------------------------------
  docker-build:
    name: '[CI] Docker Build'
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-validate]

    steps:
      - name: '[CI] Checkout'
        uses: actions/checkout@v4

      - name: '[CI] Download build backend'
        uses: actions/download-artifact@v4
        with:
          name: backend-lib
          path: easy-ecole-backend/lib/

      - name: '[CI] Download build frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: easy-ecole-web/dist/

      - name: '[CI] Build image Docker backend'
        run: |
          echo "[CI] Construction de l'image Docker backend..."
          docker build -t easyecole-backend:ci -f easy-ecole-backend/Dockerfile easy-ecole-backend/
          echo "[CI] ✅ Image backend construite avec succès"

      - name: '[CI] Build image Docker frontend'
        run: |
          echo "[CI] Construction de l'image Docker frontend..."
          docker build -t easyecole-frontend:ci -f easy-ecole-web/Dockerfile easy-ecole-web/
          echo "[CI] ✅ Image frontend construite avec succès"

      - name: '[CI] Validation docker-compose'
        run: |
          echo "[CI] Validation du fichier docker-compose.yml..."
          docker compose config --quiet
          echo "[CI] ✅ docker-compose.yml valide"

      - name: '[CI] Nettoyage images Docker'
        if: always()
        run: |
          docker rmi easyecole-backend:ci easyecole-frontend:ci 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # JOB 4 — DÉPLOIEMENT PRODUCTION (uniquement push vers main)
  # Déclenche le déploiement Dokploy + health check + smoke tests
  # ---------------------------------------------------------------------------
  deploy:
    name: '[DEPLOY] Production'
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: '[DEPLOY] Checkout'
        uses: actions/checkout@v4

      - name: '[DEPLOY] Trigger Dokploy deployment'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_TOKEN" ] || [ -z "$DOKPLOY_APP_ID" ]; then
            echo "[DEPLOY] ⚠️  Secrets Dokploy non configurés (DOKPLOY_URL, DOKPLOY_TOKEN, DOKPLOY_APP_ID)"
            echo "[DEPLOY] Le déploiement Dokploy doit être déclenché manuellement."
            echo "[DEPLOY] Si Dokploy est configuré en auto-deploy depuis GitHub, le push sur main déclenchera le déploiement automatiquement."
            exit 0
          fi

          echo "[DEPLOY] Déclenchement du déploiement Dokploy..."
          RESPONSE=$(curl -sf -X POST \
            "${DOKPLOY_URL}/api/application.deploy" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${DOKPLOY_TOKEN}" \
            -d "{\"applicationId\": \"${DOKPLOY_APP_ID}\"}" 2>&1) || {
              echo "[DEPLOY] ❌ Erreur lors du déclenchement Dokploy"
              echo "[DEPLOY] Réponse: ${RESPONSE}"
              exit 1
            }
          echo "[DEPLOY] ✅ Déploiement Dokploy déclenché"
          echo "[DEPLOY] Réponse: ${RESPONSE}"

      - name: '[DEPLOY] Attente démarrage (45s)'
        run: |
          echo "[DEPLOY] Attente du démarrage de l'application..."
          sleep 45
          echo "[DEPLOY] Démarrage terminé"

      - name: '[CHECK] Health check'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "[CHECK] ⚠️  PRODUCTION_URL non configuré — health check ignoré"
            echo "[CHECK] Configurez vars.PRODUCTION_URL dans l'environnement production"
            exit 0
          fi

          HEALTH_URL="${PRODUCTION_URL}/api/v1/health"
          echo "[CHECK] Vérification: ${HEALTH_URL}"

          MAX_RETRIES=5
          RETRY_DELAY=10
          RETRY=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY + 1))
            echo "[CHECK] Tentative ${RETRY}/${MAX_RETRIES}..."

            HTTP_CODE=$(curl -sf -o /tmp/health_response.json -w '%{http_code}' "${HEALTH_URL}" 2>/dev/null) || HTTP_CODE="000"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "[CHECK] ✅ Health check réussi (HTTP ${HTTP_CODE})"
              cat /tmp/health_response.json
              echo ""
              exit 0
            elif [ "$HTTP_CODE" = "503" ]; then
              echo "[CHECK] ⚠️  API dégradée (HTTP 503) — base de données indisponible"
              cat /tmp/health_response.json 2>/dev/null || true
              echo ""
            elif [ "$HTTP_CODE" = "000" ]; then
              echo "[CHECK] ❌ API inaccessible (pas de réponse)"
            else
              echo "[CHECK] ❌ Réponse inattendue (HTTP ${HTTP_CODE})"
              cat /tmp/health_response.json 2>/dev/null || true
              echo ""
            fi

            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "[CHECK] Nouvelle tentative dans ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          echo "[CHECK] ❌ Health check échoué après ${MAX_RETRIES} tentatives"
          exit 1

      - name: '[CHECK] Smoke tests API'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "[CHECK] ⚠️  PRODUCTION_URL non configuré — smoke tests ignorés"
            exit 0
          fi

          API_BASE="${PRODUCTION_URL}/api/v1"
          FAILURES=0

          # ── Test 1 : Endpoint root ──
          echo "[CHECK] Test 1/4 : GET /api/v1 (racine API)"
          HTTP_CODE=$(curl -sf -o /tmp/smoke_root.json -w '%{http_code}' "${API_BASE}/" 2>/dev/null) || HTTP_CODE="000"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "[CHECK]   ✅ API root accessible (HTTP 200)"
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "[CHECK]   ✅ API root retourne 404 (route non trouvée = OK, API répond)"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "[CHECK]   ❌ API inaccessible"
            FAILURES=$((FAILURES + 1))
          else
            echo "[CHECK]   ⚠️  Réponse HTTP ${HTTP_CODE}"
          fi

          # ── Test 2 : Health check ──
          echo "[CHECK] Test 2/4 : GET /api/v1/health"
          HTTP_CODE=$(curl -sf -o /tmp/smoke_health.json -w '%{http_code}' "${API_BASE}/health" 2>/dev/null) || HTTP_CODE="000"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "[CHECK]   ✅ Health check OK"
          else
            echo "[CHECK]   ❌ Health check échoué (HTTP ${HTTP_CODE})"
            FAILURES=$((FAILURES + 1))
          fi

          # ── Test 3 : Auth login avec credentials invalides (attendu 400 ou 401) ──
          echo "[CHECK] Test 3/4 : POST /api/v1/auth/login (credentials invalides)"
          HTTP_CODE=$(curl -sf -o /tmp/smoke_login.json -w '%{http_code}' \
            -X POST "${API_BASE}/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"identifiant":"ci-nonexistent-user","motDePasse":"invalid-password-ci-test"}' 2>/dev/null) || HTTP_CODE="000"

          if [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "[CHECK]   ✅ Login invalide retourne HTTP ${HTTP_CODE} (comportement attendu)"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "[CHECK]   ❌ API inaccessible (pas de réponse)"
            FAILURES=$((FAILURES + 1))
          elif [ "$HTTP_CODE" -ge 500 ]; then
            echo "[CHECK]   ❌ Erreur serveur HTTP ${HTTP_CODE}"
            FAILURES=$((FAILURES + 1))
          else
            echo "[CHECK]   ⚠️  Réponse HTTP ${HTTP_CODE} (attendu 400 ou 401)"
          fi

          # ── Test 4 : Endpoint inexistant (attendu 404) ──
          echo "[CHECK] Test 4/4 : GET /api/v1/endpoint-qui-nexiste-pas"
          HTTP_CODE=$(curl -sf -o /dev/null -w '%{http_code}' "${API_BASE}/endpoint-qui-nexiste-pas" 2>/dev/null) || HTTP_CODE="000"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "[CHECK]   ✅ 404 sur endpoint inexistant (comportement attendu)"
          elif [ "$HTTP_CODE" = "000" ]; then
            echo "[CHECK]   ❌ API inaccessible"
            FAILURES=$((FAILURES + 1))
          else
            echo "[CHECK]   ⚠️  Réponse HTTP ${HTTP_CODE} (attendu 404)"
          fi

          # ── Résumé ──
          echo ""
          if [ $FAILURES -gt 0 ]; then
            echo "[CHECK] ❌ ${FAILURES} smoke test(s) échoué(s)"
            exit 1
          else
            echo "[CHECK] ✅ Tous les smoke tests sont passés"
            exit 0
          fi

      - name: '[DEPLOY] Résumé'
        if: always()
        run: |
          echo "============================================"
          echo "[DEPLOY] RÉSUMÉ DU DÉPLOIEMENT"
          echo "============================================"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Branche  : ${{ github.ref_name }}"
          echo "  Date     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
