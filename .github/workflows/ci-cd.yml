# =============================================================================
# EasyEcole - Pipeline CI (GitHub Actions)
#
# Role : VALIDATION UNIQUEMENT (tests + builds).
# Le deploiement en production est gere par l'AUTO-DEPLOY GIT NATIF de Dokploy
# (Dokploy surveille le depot GitHub et redeploie le docker-compose sur push
# vers la branche de production). Cette separation garantit que Dokploy ne
# redeploie que du code valide : le merge/push sur la branche de production est
# soumis a la validation CI via la branch protection GitHub
# (require status checks to pass).
#
# Declaration :
#   - Pull Request vers la branche de production -> validation complete
#   - Push vers la branche de production -> validation + build Docker
#
# Branche de production : MASTER (branche de travail courante du projet).
#
# Architecture :
#   Job 1: backend-validate   (install, typecheck, tests, build)
#   Job 2: frontend-validate  (install, build production)
#   Job 3: docker-build       (build images backend + frontend + validation compose)
#
# NOTE : l'ancien "job deploy" (declenchement API Dokploy via DOKPLOY_URL /
# DOKPLOY_TOKEN / DOKPLOY_APP_ID) a ete SUPPRIME car le serveur Dokploy est
# en reseau local (192.168.56.10) et n'est pas joignable depuis GitHub Actions.
# Le deploiement est confie a l'auto-deploy Git de Dokploy.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Limiter les executions concurrentes pour la meme branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# =============================================================================
# JOBS
# =============================================================================
jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - BACKEND VALIDATION
  # Installation, typecheck TypeScript, tests Jest, build Babel
  # ---------------------------------------------------------------------------
  backend-validate:
    name: '[CI] Backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-ecole-backend

    steps:
      - name: '[CI] Checkout'
        uses: actions/checkout@v4

      - name: '[CI] Setup Node.js ${{ env.NODE_VERSION }}'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: easy-ecole-backend/package-lock.json

      - name: '[CI] Installation des dependances backend'
        run: npm ci

      - name: '[CI] Typecheck TypeScript'
        run: npx tsc --noEmit

      - name: '[CI] Tests backend (Jest)'
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-test-secret-key-not-for-production' }}
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_NAME: easyecole_test
          DB_USER: root
          DB_PASS: ''
          CORS_ORIGIN: http://localhost:4200

      - name: '[CI] Build backend (Babel -> lib/)'
        run: npm run build

      - name: '[CI] Upload build backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-lib
          path: easy-ecole-backend/lib/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # JOB 2 - FRONTEND VALIDATION
  # Installation, build production Angular
  # ---------------------------------------------------------------------------
  frontend-validate:
    name: '[CI] Frontend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-ecole-web

    steps:
      - name: '[CI] Checkout'
        uses: actions/checkout@v4

      - name: '[CI] Setup Node.js ${{ env.NODE_VERSION }}'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: easy-ecole-web/package-lock.json

      - name: '[CI] Installation des dependances frontend'
        run: npm ci
        env:
          # Puppeteer tente de telecharger Chromium pendant npm ci - inutile ici
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: '[CI] Typecheck Angular'
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: '[CI] Build frontend production'
        run: ng build --configuration production
        env:
          NODE_OPTIONS: '--openssl-legacy-provider --max-old-space-size=3072'
          NG_CLI_ANALYTICS: 'false'

      - name: '[CI] Upload build frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: easy-ecole-web/dist/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # JOB 3 - DOCKER BUILD VALIDATION
  # Verifie que les images Docker se construisent sans erreur
  # ---------------------------------------------------------------------------
  docker-build:
    name: '[CI] Docker Build'
    runs-on: ubuntu-latest
    needs: [backend-validate, frontend-validate]

    steps:
      - name: '[CI] Checkout'
        uses: actions/checkout@v4

      - name: '[CI] Download build backend'
        uses: actions/download-artifact@v4
        with:
          name: backend-lib
          path: easy-ecole-backend/lib/

      - name: '[CI] Download build frontend'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: easy-ecole-web/dist/

      - name: '[CI] Build image Docker backend'
        run: |
          echo "[CI] Construction de l'image Docker backend..."
          docker build -t easyecole-backend:ci -f easy-ecole-backend/Dockerfile easy-ecole-backend/
          echo "[CI] Image backend construite avec succes"

      - name: '[CI] Build image Docker frontend'
        run: |
          echo "[CI] Construction de l'image Docker frontend..."
          docker build -t easyecole-frontend:ci -f easy-ecole-web/Dockerfile easy-ecole-web/
          echo "[CI] Image frontend construite avec succes"

      - name: '[CI] Validation docker-compose'
        run: |
          echo "[CI] Validation du fichier docker-compose.yml..."
          docker compose config --quiet
          echo "[CI] docker-compose.yml valide"

      - name: '[CI] Nettoyage images Docker'
        if: always()
        run: |
          docker rmi easyecole-backend:ci easyecole-frontend:ci 2>/dev/null || true
