# =============================================================================
# EasyEcole — Docker Compose (MONO-VM)
#
# CIBLE : une seule machine virtuelle, tout-en-un.
#   - MySQL 8.0 embarque dans le service `db`
#   - backend, worker, redis et frontend runs sur la meme VM
#   - stockage documentaire + backups sur bind mounts hote
#
# Ce fichier reste compatible avec le layout documentaire courant de l'application
# (document storage unifie /app/documents + /app/backups) et avec l'architecture
# mono-VM historique (DB interne + fichiers persistants).
# =============================================================================

name: easyecole

services:
  # ---------------------------------------------------------------------------
  # 0) INITIALISATION DU STOCKAGE DOCUMENTAIRE (one-shot, avant backend)
  # ---------------------------------------------------------------------------
  init-storage:
    image: mysql:8.0
    container_name: easyecole-init-storage
    restart: "no"
    user: "0:0"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    environment:
      DOCUMENTS_ROOT: /documents
      BACKUP_STORAGE_ROOT: /storage
      SKIP_MOUNT_CHECK: "true"
      FIX_PERMISSIONS: "false"
      ACADEMIC_YEAR_UNTIL: ${ACADEMIC_YEAR_UNTIL:-2050}
      ACADEMIC_YEARS: ${ACADEMIC_YEARS:-}
      ACADEMIC_YEAR_FROM: ${ACADEMIC_YEAR_FROM:-2025-2026}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-easyecole}
      DB_USER: ${DB_USER:-easyecole_app}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
    volumes:
      - ${DOCUMENTS_HOST_PATH:-/data/documents}:/documents
      - ${BACKUP_STORAGE_HOST_PATH:-/data/backups}:/storage
      - ./scripts/init-document-storage.sh:/usr/local/bin/init-document-storage.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/init-document-storage.sh"]
    command: []
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 1) BASE DE DONNEES MySQL 8.0 (EMBARQUEE — mono-VM)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: easyecole-db
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 200
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:-easyecole}
      MYSQL_USER: ${DB_USER:-easyecole_app}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS must be set}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-config/my.cnf:/etc/mysql/conf.d/zz-easyecole.cnf:ro
    ports:
      - "${DB_REPLICATION_BIND:-127.0.0.1}:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 1b) SAUVEGARDE MYSQL QUOTIDIENNE
  # ---------------------------------------------------------------------------
  mysql-backup:
    image: mysql:8.0
    container_name: easyecole-mysql-backup
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-easyecole}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-900}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      REQUIRE_WS22_MOUNT: ${REQUIRE_WS22_MOUNT:-false}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql_backups:/backups/mysql
      - ${PUBLIC_HOST_PATH:-/data/application/public}:/data/uploads:ro
      - ${STORAGE_HOST_PATH:-/data/application/storage}:/data/storage:ro
      - ${UPLOADS_HOST_PATH:-/data/application/uploads}:/data/pv:ro
      - ${DOCUMENTS_HOST_PATH:-/data/documents}:/data/documents:ro
      - ${BACKUPS_HOST_PATH:-/data/backups}:/backups/offsite
      - ./scripts/mysql-backup.sh:/usr/local/bin/mysql-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/mysql-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 2) BACKEND API Express/Node
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: easy-ecole-backend/Dockerfile
    container_name: easyecole-backend
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g
    pids_limit: 300
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      init-storage:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    user: "0:0"
    ports:
      - "${HIKVISION_BIND_IP:-0.0.0.0}:${HIKVISION_PORT:-8000}:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-easyecole}
      DB_USER: ${DB_USER:-easyecole_app}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_SSL: ${DB_SSL:-off}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      DOCGEN_SECRET: ${DOCGEN_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      HIKVISION_POLLING_ENABLED: ${HIKVISION_POLLING_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set (ex. http://<IP_PUBLIQUE>)}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TZ: ${TZ:-UTC}
      MIGRATIONS_ON_BOOT: ${MIGRATIONS_ON_BOOT:-true}
      DB_BOOTSTRAP_SCHEMA: ${DB_BOOTSTRAP_SCHEMA:-true}
      DOCUMENTS_STORAGE_DIR: ${DOCUMENTS_STORAGE_DIR:-/app/documents}
      TMP_DIR: ${TMP_DIR:-/tmp/easyecole}
      REQUIRE_DOCUMENTS_MOUNT: ${REQUIRE_DOCUMENTS_MOUNT:-true}
      ALLOW_ROOT_FALLBACK: ${ALLOW_ROOT_FALLBACK:-true}
      ACADEMIC_YEAR: ${ACADEMIC_YEAR:-}
      HIKVISION_TUNNEL_ACCESS_CLIENT_ID: ${HIKVISION_TUNNEL_ACCESS_CLIENT_ID:-}
      HIKVISION_TUNNEL_ACCESS_CLIENT_SECRET: ${HIKVISION_TUNNEL_ACCESS_CLIENT_SECRET:-}
      HIKVISION_TUNNEL_HOSTS: ${HIKVISION_TUNNEL_HOSTS:-}
    networks:
      - app
      - data
    volumes:
      - ${DOCUMENTS_HOST_PATH:-/data/documents}:/app/documents
      - ${BACKUP_STORAGE_HOST_PATH:-/data/backups}:/app/backups
      - ${PUBLIC_HOST_PATH:-/data/application/public}:/app/public
      - ${UPLOADS_HOST_PATH:-/data/application/uploads}:/app/uploads
      - ${STORAGE_HOST_PATH:-/data/application/storage}:/app/storage
      - ${CONFIG_HOST_PATH:-/opt/mon-app/config}:/app/config
      - ${KEYS_HOST_PATH:-/opt/mon-app/keys}:/app/.keys
      - ${TMP_HOST_PATH:-/opt/mon-app/tmp}:/data/tmp
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/v1/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 420s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 2b) WORKERS BullMQ (OCR, PDF, import Excel)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: easy-ecole-backend/Dockerfile
    container_name: easyecole-worker
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g
    pids_limit: 300
    init: true
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "lib/core/workers/index.js"]
    command: []
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-easyecole}
      DB_USER: ${DB_USER:-easyecole_app}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_SSL: ${DB_SSL:-off}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
      DOCUMENTS_STORAGE_DIR: ${DOCUMENTS_STORAGE_DIR:-/app/documents}
      TMP_DIR: ${TMP_DIR:-/tmp/easyecole}
      ACADEMIC_YEAR: ${ACADEMIC_YEAR:-}
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    volumes:
      - ${DOCUMENTS_HOST_PATH:-/data/documents}:/app/documents
      - ${BACKUP_STORAGE_HOST_PATH:-/data/backups}:/app/backups
      - ${PUBLIC_HOST_PATH:-/data/application/public}:/app/public
      - ${UPLOADS_HOST_PATH:-/data/application/uploads}:/app/uploads
      - ${STORAGE_HOST_PATH:-/data/application/storage}:/app/storage
      - ${CONFIG_HOST_PATH:-/opt/mon-app/config}:/app/config
      - ${KEYS_HOST_PATH:-/opt/mon-app/keys}:/app/.keys

  # ---------------------------------------------------------------------------
  # 3) CACHE REDIS 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: easyecole-redis
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 100
    init: true
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 4) FRONTEND nginx (build Angular + proxy /api)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./easy-ecole-web
    container_name: easyecole-frontend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 100
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# =============================================================================
# VOLUMES NOMES
# =============================================================================
volumes:
  mysql_data:
  mysql_backups:
  redis_data:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
