# =============================================================================
# EasyEcole — Docker Compose (déploiement production : Ubuntu + Dokploy)
#
# TOPOLOGIE ESA (2 VM Hyper-V) :
#   - VM APP (192.168.100.10 — 6 vCPU / 6 Go RAM / 1 To) : héberge CETTE stack
#       backend (API Express/Node), worker (BullMQ), redis (cache), frontend (nginx)
#   - VM DB  (192.168.100.20 — 4 vCPU / 6 Go RAM / 3 To) : MySQL 8.0 NATIF,
#       HORS Docker. La base n'est ni conteneurisée ni sauvegardée par ce compose.
#
# BASE DE DONNÉES : EXTERNE. Le backend s'y connecte via DB_HOST (défaut
#   192.168.100.20:3306). Autorisations pare-feu attendues :
#     - VM DB  : autoriser 3306 entrant depuis la VM APP uniquement
#     - VM APP : autoriser la SORTIE vers 3306 (+ ports applicatifs utiles)
#
# 4 services :
#   - backend  : API Express/Node (build local, bind mounts uploads/storage…)
#   - worker   : workers BullMQ (OCR, PDF, import Excel) — même image que backend
#   - redis    : Redis 7 (cache réponse API, fail-safe, volume redis_data)
#   - frontend : nginx servant le build Angular + proxy /api -> backend:3000
#
# PORTS :
#   - 80 (hôte) -> 80 (frontend/nginx)  : application web + proxy API
#   - 3000 et 3306 NE SONT PAS exposés sur l'hôte par défaut
#
# VARIABLES D'ENVIRONNEMENT (DOKPLOY) :
#   Saisir toutes les variables dans Dokploy (onglet "Environment" du projet) :
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS,
#   JWT_SECRET, DOCGEN_SECRET, CORS_ORIGIN, SMTP_*, REDIS_URL…
#   - Le service backend reçoit automatiquement toutes les variables du projet
#     (remplace l'ancien `env_file: .env` — PAS de fichier .env dans le repo).
#   - Chemins HÔTE des bind mounts (facultatifs ; défauts sous /opt/mon-app/) :
#       STORAGE_HOST_PATH → /app/storage (PDF docgen, cartes, qr-codes)  [/opt/mon-app/storage]
#       PUBLIC_HOST_PATH  → /app/public  (uploads, GED, bordereaux, dossiers) [/opt/mon-app/public]
#       UPLOADS_HOST_PATH → /app/uploads (PV de délibération)            [/opt/mon-app/uploads]
#       CONFIG_HOST_PATH  → /app/config  (configuration de stockage)     [/opt/mon-app/config]
#       KEYS_HOST_PATH    → /app/.keys   (clé maîtresse AES)             [/opt/mon-app/keys]
#       BACKUPS_HOST_PATH → /app/backups (sauvegardes intégrité GED)     [/opt/mon-app/backups]
#     En local (dev Windows), définir ces chemins sous ./.data/ dans .env.
#
# LOCAL (dev) : lancer avec l'override local :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   (docker-compose.local.yml remap le frontend sur le port 8091 et est ignoré
#   par git — ne JAMAIS le déployer en production, voir .gitignore)
#
# RÉSEAUX : `app` relie nginx au backend; `data` (interne) relie backend,
# workers et Redis.
# =============================================================================

name: easyecole

services:
  # ---------------------------------------------------------------------------
  # 2) BACKEND API Express/Node
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: easy-ecole-backend/Dockerfile
    container_name: easyecole-backend
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g
    pids_limit: 300
    init: true
    security_opt:
      - no-new-privileges:true
    # Hôte de la base : la BD est EXTERNE (VM DB 192.168.100.20).
    # DB_HOST DOIT pointer vers la VM DB (défaut ci-dessous), PAS vers un
    # conteneur `db` (qui n'existe plus dans cette stack).
    # (Ancien `env_file: .env` supprimé : Dokploy ne lit pas de fichier .env.)
    # REDIS_URL : valeur par défaut vers le service cache ; toute valeur saisie
    # dans Dokploy (${REDIS_URL}) la remplace sans toucher à ce fichier.
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-192.168.100.20}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-easyecole}
      DB_USER: ${DB_USER:-easyecole_app}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_SSL: ${DB_SSL:-off}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      DOCGEN_SECRET: ${DOCGEN_SECRET}
      # ⚠️ REQUIS : src/app.ts lève une erreur au chargement si CORS_ORIGIN est
      # absent/vide → crash du conteneur au boot (jamais « healthy »). On
      # échoue donc explicitement ici pour un message clair au déploiement.
      # Valeur attendue en production : http://<IP_VM_APP>:8080
      # (inclure le PORT, ex. http://192.168.100.10:8080).
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in Dokploy (e.g. http://192.168.100.10:8080)}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TZ: ${TZ:-UTC}
      # L'historique de migrations est inclus dans l'image; exécution automatique
      # activée par défaut (migrations idempotentes, suivi schema_migrations).
      # Fail-fast : une migration en échec bloque le démarrage (pas d'API à
      # moitié migrée). Pour sauter : MIGRATIONS_ON_BOOT=false.
      MIGRATIONS_ON_BOOT: ${MIGRATIONS_ON_BOOT:-true}
      # Amorçage du schéma de BASE avant migrations (tables MANQUANTES
      # uniquement, sans ALTER) : indispensable sur une base NEUVE, sans effet
      # sur une base existante. Non bloquant. Pour désactiver : =false.
      # Voir docker-entrypoint.sh §0c (migrations d'évolution vs impasse).
      DB_BOOTSTRAP_SCHEMA: ${DB_BOOTSTRAP_SCHEMA:-true}
    networks:
      - app
      - data
    volumes:
      # ── Fichiers UPLOADÉS (multer, GED, dossiers, bordereaux, rattrapage…)
      # /app/public dans le conteneur (chemins relatifs à process.cwd()).
      # BIND MOUNT hôte : fichiers VISIBLES et PERSISTANTS sur le disque de la
      # VM dans ${PUBLIC_HOST_PATH} (défaut /opt/mon-app/public).
      - ${PUBLIC_HOST_PATH:-/opt/mon-app/public}:/app/public
      # ── PV de délibération (GenerateurPVService / DeliberationController).
      # Chemin DISTINCT de public/uploads : /app/uploads. Sans ce montage, les
      # PV PDF sont PERDUS à chaque recréation de conteneur.
      - ${UPLOADS_HOST_PATH:-/opt/mon-app/uploads}:/app/uploads
      # ── Stockage PDF persistant : /app/storage (docgen, pdfs, comite-pdfs,
      # cartes, qr-codes). Les documents GÉNÉRÉS (attestations, autorisations,
      # bordereaux, reçus docgen) vivent ici → visibles sur l'hôte.
      # PRÉPARER LES DOSSIERS HÔTE AVANT le premier déploiement :
      #   sudo mkdir -p /opt/mon-app/{storage/pdfs,public,uploads,config,keys,backups}
      #   sudo chown -R 1000:1000 /opt/mon-app
      #   sudo chmod -R u+rwX,g+rwX /opt/mon-app
      # (1000:1000 = utilisateur `node` du conteneur ; vérifier : id node)
      # docker-entrypoint.sh refuse de démarrer si /app/storage/pdfs n'est
      # pas inscriptible (fail-fast).
      - ${STORAGE_HOST_PATH:-/opt/mon-app/storage}:/app/storage
      # ── Configuration de stockage modifiable (StorageConfigController).
      - ${CONFIG_HOST_PATH:-/opt/mon-app/config}:/app/config
      # ── Clé maîtresse AES (EncryptionService, dossier /app/.keys).
      # ⚠️ NE JAMAIS perdre ce dossier : sa disparition rend INDÉCHIFFRABLES
      # toutes les données déjà chiffrées en base.
      - ${KEYS_HOST_PATH:-/opt/mon-app/keys}:/app/.keys
      # ── Sauvegardes d'INTÉGRITÉ GED (IntegrityController → backups/ged_<ts>).
      # La table `ged_backups` est en base, mais les fichiers archivés vivent
      # ici : sans ce montage, chaque redéploiement ORPHELINE les enregistrements
      # de sauvegarde (fichiers introuvables → restauration impossible).
      - ${BACKUPS_HOST_PATH:-/opt/mon-app/backups}:/app/backups
    # Port 3000 NON exposé par défaut : le frontend passe par le proxy nginx.
    # À décommenter pour du debug (tests curl directs) :
    # ports:
    #   - "3000:3000"
    healthcheck:
      # ⚠️ 127.0.0.1 (et NON localhost) : le serveur écoute sur 0.0.0.0 (IPv4)
      # (voir Dockerfile : CMD [... "0.0.0.0"] → process.argv[2]). Depuis
      # Node ≥ 17, l'ordre de résolution DNS est « verbatim » : « localhost »
      # peut être résolu en ::1 (IPv6), interface NON écoutée par le serveur →
      # le test échouait en boucle. L'adresse IPv4 littérale lève l'ambiguïté.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/v1/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      # ⚠️ Fenêtre de démarrage du backend (élargie 2026-10-13) :
      # L'entrypoint exécute, AVANT que l'API n'écoute :
      #   0c. amorçage du schéma (borné à 300 s, non bloquant)
      #   1.  migrations SQL fail-fast (jusqu'à ~34 fichiers la 1ère fois)
      #   2.  seed-boot : 6 seeds idempotents séquentiels (comptes+RBAC,
      #       docgen, GED, dossiers GED, documents requis, frais)
      # Sur une base neuve, la séquence complète peut dépasser 7 min : Docker
      # marquait le backend « unhealthy » alors que le boot se terminait
      # correctement plus tard → deploy Dokploy en échec
      # (« dependency failed to start: container easyecole-backend is
      # unhealthy »).
      # Fenêtre élargie : 420 s + 20×15 s ≈ 12 min (au lieu de 7).
      retries: 20
      start_period: 420s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 2b) WORKERS BullMQ (OCR, PDF, import Excel)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: easy-ecole-backend/Dockerfile
    container_name: easyecole-worker
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g
    pids_limit: 300
    init: true
    security_opt:
      - no-new-privileges:true
    # ⚠️ Le worker court-circuite docker-entrypoint.sh (pas de migrations ni
    # de vérification de stockage ici) : c'est le backend qui crée et vérifie
    # /app/storage/pdfs au démarrage, et le worker ne démarre qu'après le
    # backend healthy (depends_on). Même bind mount que le backend.
    entrypoint: ["node", "lib/core/workers/index.js"]
    command: []
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Same EXTERNAL database as the backend (VM DB 192.168.100.20).
      DB_HOST: ${DB_HOST:-192.168.100.20}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-easyecole}
      DB_USER: ${DB_USER:-easyecole_app}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_SSL: ${DB_SSL:-off}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    volumes:
      # Mêmes BIND MOUNTS hôte que le backend (voir commentaires détaillés
      # ci-dessus) : le worker OCR/PDF doit écrire dans les mêmes dossiers.
      - ${PUBLIC_HOST_PATH:-/opt/mon-app/public}:/app/public
      - ${UPLOADS_HOST_PATH:-/opt/mon-app/uploads}:/app/uploads
      - ${STORAGE_HOST_PATH:-/opt/mon-app/storage}:/app/storage
      - ${CONFIG_HOST_PATH:-/opt/mon-app/config}:/app/config
      - ${KEYS_HOST_PATH:-/opt/mon-app/keys}:/app/.keys
      - ${BACKUPS_HOST_PATH:-/opt/mon-app/backups}:/app/backups

  # ---------------------------------------------------------------------------
  # 3) CACHE REDIS 7 (cache réponse middleware `cache()` — fail-safe)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: easyecole-redis
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 100
    init: true
    security_opt:
      - no-new-privileges:true
    # Persistance AOF (survie au redémarrage) + limite mémoire avec politique
    # d'éviction LRU globale (les clés cache peuvent être purgées sous charge).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 4) FRONTEND nginx (build Angular + proxy)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./easy-ecole-web
    container_name: easyecole-frontend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      # Port HTTP public de l'application : hôte 8080 -> nginx (conteneur) 80.
      # Le port 80 de l'hôte étant déjà occupé sur la VM APP, on publie sur 8080.
      # L'application est donc servie sur http://<IP_VM_APP>:8080/
      # (remettre "80:80" si le port 80 hôte est un jour libéré).
      - "8080:80"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 100
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# =============================================================================
# VOLUMES NOMÉS
# =============================================================================
volumes:
  # Persistance du cache Redis (fichiers AOF dans /data)
  redis_data:
  # ⚠️ L'ancien volume nommé `uploads` (/app/public) n'est PLUS déclaré :
  # /app/public est désormais un BIND MOUNT sur ${PUBLIC_HOST_PATH} (défaut
  # /opt/mon-app/public). L'ancien volume (easyecole_uploads) reste sur le
  # disque : il contient les fichiers uploadés AVANT la bascule (GED, photos,
  # bordereaux, dossiers). LE MIGRER vers le bind mount avant de le supprimer :
  #   docker run --rm -v easyecole_uploads:/from -v /opt/mon-app/public:/to \
  #     busybox sh -c 'cp -a /from/. /to/'
  #   docker volume rm easyecole_uploads
  # ⚠️ L'ancien volume nommé `storage` n'est PLUS déclaré : /app/storage est
  # désormais un bind mount sur ${STORAGE_HOST_PATH} (défaut
  # /opt/mon-app/storage). L'ancien volume (easyecole_storage) reste sur le
  # disque après cette mise à jour : il contient les PDF créés avant la
  # bascule et doit être MIGRÉ vers le bind mount (voir compte-rendu), puis
  # supprimé une fois la migration vérifiée (`docker volume rm easyecole_storage`).
  #
  # ⚠️ BASE DE DONNÉES : plus AUCUN volume MySQL ici. La base est EXTERNE
  # (VM DB 192.168.100.20). Sauvegardes et persistance sont gérées côté VM DB.

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
