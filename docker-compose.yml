name: easyecole

services:

  backend:
    build:
      context: ./easy-ecole-backend
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}

      # MySQL distant — srvDB
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-easy-db}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_SYNC_ON_BOOT: ${DB_SYNC_ON_BOOT:-false}

      # Redis local sur srvAPP
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

      BACKEND_DIR: /app
      MIGRATIONS_DIR: /app/migrations

      # Secrets / services applicatifs
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      DOCGEN_SECRET: ${DOCGEN_SECRET}

      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}

      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_BASE_URL: ${CINETPAY_BASE_URL}
      CINETPAY_MERCHANT_ID: ${CINETPAY_MERCHANT_ID}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      DB_SSL: ${DB_SSL:-false}

    volumes:
      - ./migrations:/app/migrations:ro
      - ./scripts/apply-migrations.cjs:/app/scripts/apply-migrations.cjs:ro
      - uploads:/app/public
      - storage:/app/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://localhost:3000/api/v1/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    depends_on:
      redis:
        condition: service_healthy


  worker:
    build:
      context: ./easy-ecole-backend
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g

    entrypoint:
      - node
      - lib/core/workers/index.js

    environment:
      NODE_ENV: ${NODE_ENV:-production}

      # MySQL distant — srvDB
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-easy-db}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_SYNC_ON_BOOT: ${DB_SYNC_ON_BOOT:-false}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}

    volumes:
      - uploads:/app/public
      - storage:/app/storage

    depends_on:
      redis:
        condition: service_healthy


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  frontend:
    build:
      context: ./easy-ecole-web
    restart: unless-stopped
    mem_limit: 256m

    depends_on:
      backend:
        condition: service_healthy


volumes:
  uploads:
  storage:
  redis_data:
