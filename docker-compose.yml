# =============================================================================
# EasyEcole — Docker Compose (déploiement production : Ubuntu + Dokploy)
#
# 4 services :
#   - db       : MySQL 8.0 (base de données, volume persistant mysql_data)
#   - backend  : API Express/Node (build local, volume uploads -> /app/public,
#                volume storage -> /app/storage)
#   - redis    : Redis 7 (cache réponse API, fail-safe, volume redis_data)
#   - frontend : nginx servant le build Angular + proxy /api -> backend:3000
#
# PORTS :
#   - 80 (hôte) -> 80 (frontend/nginx)  : application web + proxy API
#   - 3000 et 3306 NE SONT PAS exposés sur l'hôte par défaut
#
# VARIABLES D'ENVIRONNEMENT (DOKPLOY) :
#   Saisir toutes les variables dans Dokploy (onglet "Environment" du projet) :
#   JWT_SECRET, DB_PASS, CORS_ORIGIN, SMTP_*, CINETPAY_*, ENCRYPTION_MASTER_KEY…
#   - Le service db interpole ${MYSQL_ROOT_PASSWORD}, ${DB_PASS}, ${DB_USER},
#     ${DB_NAME}, ${TZ} depuis
#     les variables du projet (Dokploy les injecte aussi dans les conteneurs).
#   - Le service backend reçoit automatiquement toutes les variables du projet
#     (remplace l'ancien `env_file: .env` — PAS de fichier .env dans le repo).
#
# LOCAL (dev) : lancer avec l'override local :
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   (docker-compose.local.yml remap le frontend sur le port 8091 et est ignoré
#   par git — ne JAMAIS le déployer en production, voir .gitignore)
#
# RÉSEAUX : `app` relie nginx au backend; `data` (interne) relie backend,
# workers, MySQL et Redis. MySQL/Redis ne sont pas joignables depuis nginx.
# =============================================================================

name: easyecole

services:
  # ---------------------------------------------------------------------------
  # 1) BASE DE DONNÉES MySQL 8.0
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: easyecole-db
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 200
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      # Mot de passe root MySQL (à remplacer dans .env)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      # Compte applicatif dédié, initialisé uniquement à la création du volume.
      MYSQL_USER: ${DB_USER:-easyecole_app}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS must be set}
      # Base créée au premier démarrage (le DUMP est ensuite importé)
      MYSQL_DATABASE: ${DB_NAME:-easyecole}
      # Fuseau horaire
      TZ: ${TZ:-UTC}
    # Volume persistant : les données survivent aux recréations de conteneur
    volumes:
      - mysql_data:/var/lib/mysql
    # Healthcheck : on attend que MySQL réponde avant de démarrer le backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 1b) SAUVEGARDE MYSQL
  # ---------------------------------------------------------------------------
  mysql-backup:
    image: mysql:8.0
    container_name: easyecole-mysql-backup
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-easyecole}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - mysql_backups:/backups/mysql
      - uploads:/data/uploads:ro
      - storage:/data/storage:ro
      - ./scripts/mysql-backup.sh:/usr/local/bin/mysql-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/mysql-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    # ⚠️ CONFLICT PORT 3306 : si un MySQL natif tourne déjà sur le serveur
    # Windows, NE PAS exposer le port de ce conteneur sur l'hôte.
    # Décommentez uniquement si vous avez besoin d'y accéder depuis l'hôte
    # (utilisez 3307 pour éviter le conflit) :
    # ports:
    #   - "3307:3306"
    # ⚠️ IMPORTANT : si vous exposez un port hôte différent de 3306, mettez à
    # jour DB_PORT dans .env (le backend pointe vers le service `db`, donc
    # DB_PORT=3306 reste correct dans le réseau Docker).

  # ---------------------------------------------------------------------------
  # 2) BACKEND API Express/Node
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: easy-ecole-backend/Dockerfile
    container_name: easyecole-backend
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g
    pids_limit: 300
    init: true
    security_opt:
      - no-new-privileges:true
    # Variables DB explicites : DB_HOST DOIT valoir `db` (nom du service),
    # PAS localhost. Les autres variables applicatives sont configurées dans
    # l'environnement du déploiement.
    # (Ancien `env_file: .env` supprimé : Dokploy ne lit pas de fichier .env.)
    # REDIS_URL : valeur par défaut vers le service cache ; toute valeur saisie
    # dans Dokploy (${REDIS_URL}) la remplace sans toucher à ce fichier.
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-easyecole}
      DB_USER: ${DB_USER:-easyecole_app}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_SSL: ${DB_SSL:-off}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # L'historique de migrations est inclus dans l'image; conserver l'exécution
      # automatique désactivée pour éviter d'appliquer des migrations anciennes
      # non encore validées sur une base existante.
      MIGRATIONS_ON_BOOT: ${MIGRATIONS_ON_BOOT:-false}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - data
    volumes:
      # Fichiers uploadés (multer, GED, dossiers, docgen, photos…) :
      # /app/public dans le conteneur (chemin relatif à process.cwd()).
      - uploads:/app/public
      # Cartes étudiantes générées + docgen : /app/storage
      - storage:/app/storage
    # Port 3000 NON exposé par défaut : le frontend passe par le proxy nginx.
    # À décommenter pour du debug (tests curl directs) :
    # ports:
    #   - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/v1/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 2b) WORKERS BullMQ (OCR, PDF, import Excel)
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: easy-ecole-backend/Dockerfile
    container_name: easyecole-worker
    restart: unless-stopped
    mem_limit: 2g
    shm_size: 1g
    pids_limit: 300
    init: true
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "lib/core/workers/index.js"]
    command: []
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-easyecole}
      DB_USER: ${DB_USER:-easyecole_app}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_SSL: ${DB_SSL:-off}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    volumes:
      - uploads:/app/public
      - storage:/app/storage

  # ---------------------------------------------------------------------------
  # 3) CACHE REDIS 7 (cache réponse middleware `cache()` — fail-safe)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: easyecole-redis
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 100
    init: true
    security_opt:
      - no-new-privileges:true
    # Persistance AOF (survie au redémarrage) + limite mémoire avec politique
    # d'éviction LRU globale (les clés cache peuvent être purgées sous charge).
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 4) FRONTEND nginx (build Angular + proxy)
  # ---------------------------------------------------------------------------
  frontend:
    build: ./easy-ecole-web
    container_name: easyecole-frontend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      # Port HTTP public de l'application. À adapter (ex: "8080:80") si le
      # port 80 est déjà occupé sur le serveur Windows.
      - "80:80"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 100
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# =============================================================================
# VOLUMES NOMÉS
# =============================================================================
volumes:
  # Données MySQL (base complète importée depuis le dump)
  mysql_data:
  # Fichiers uploadés du backend (/app/public)
  uploads:
  # Cartes étudiantes et documents générés (/app/storage)
  storage:
  # Persistance du cache Redis (fichiers AOF dans /data)
  redis_data:
  # Dumps compressés MySQL ; monter ce volume vers un stockage externe en prod.
  mysql_backups:

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
